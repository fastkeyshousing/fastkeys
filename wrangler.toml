name = "fastkeys"
compatibility_date = "2026-07-30"
pages_build_output_dir = "public"

# Non-secret configuration. Secrets never live here: set them under
# Workers & Pages -> fastkeys -> Settings -> Variables and Secrets, or with
# `npx wrangler pages secret put <NAME>`.
[vars]
SITE_URL = "https://fastkeyshousing.com"

# The only amount charged at checkout: the EUR 1.00 spot confirmation. The
# service fee (one month's rent) cannot live here, because its amount is not
# known until the applicant signs a lease. Checkout saves the card so that fee
# can be taken later; nothing takes it automatically yet.
# Live price on product prod_V0NqLeN8SpuYjQ "FastKeys spot confirmation".
# The retired EUR 50.00 price was price_1Tz3FmAiFErDFrhod3Xg44m0.
STRIPE_CONFIRMATION_PRICE_ID = "price_1U0N5PAiFErDFrho5U569Ja4"

# Viewing services, sold separately from the application. Create both as one-off
# products in Stripe and paste the price ids here. Until they are set, the
# booking form returns not_configured rather than charging a wrong amount.
STRIPE_ONLINE_VIEWING_PRICE_ID = "price_1U2vCoAiFErDFrhoqmnFWs1k"   # EUR 50.00, prod_V31FfDU65h8Jun
STRIPE_EXPRESS_VIEWING_PRICE_ID = "price_1U2vCwAiFErDFrhoqeMmti2E"  # EUR 100.00, prod_V31FoTVeRsAZpe

[[d1_databases]]
binding = "DB"
database_name = "fastkeys"
database_id = "7afc3947-69e8-4f9e-ad69-6b82c6af6186"

# Applicant documents. Create with EU jurisdiction so the files stay in the EEA,
# as the Terms promise:
#
#   npx wrangler r2 bucket create fastkeys-documents --jurisdiction eu
#
# The bucket must stay private. Never attach a public r2.dev URL or a custom
# domain to it: every read goes through /api/panel/document, which checks the
# session and the role first.
[[r2_buckets]]
binding = "DOCS"
bucket_name = "fastkeys-documents"
