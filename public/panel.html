*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--slate); color:var(--chalk);
  font-family:var(--body); font-size:17px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%; display:block}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--display); font-weight:500; line-height:1.06; margin:0; letter-spacing:-.02em}
p{margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--key); outline-offset:3px; border-radius:2px}

.wrap{max-width:var(--maxw); margin:0 auto; padding-inline:var(--gut)}
.skip{position:absolute; left:-9999px; top:0; background:var(--key); color:var(--ink); padding:12px 18px; z-index:300}
.skip:focus{left:12px; top:12px}

/* ---------- shared bits ---------- */
.eyebrow{
  font-family:var(--body); font-size:12px; font-weight:600;
  letter-spacing:.18em; text-transform:uppercase; color:var(--key);
  display:flex; align-items:center; gap:10px;
}
.eyebrow::before{content:""; width:26px; height:1px; background:var(--key); opacity:.6}
.lead{font-size:clamp(17px,1.6vw,19px); color:rgba(237,239,242,.74); max-width:60ch}
.section{padding-block:clamp(72px,10vw,132px)}

.btn{
  display:inline-flex; align-items:center; gap:10px; text-decoration:none;
  padding:15px 26px; border-radius:999px; font-weight:600; font-size:15.5px;
  border:1px solid transparent; cursor:pointer;
  transition:transform .25s var(--ease), background .25s, border-color .25s, color .25s, box-shadow .25s;
}
.btn-key{background:var(--key); color:#2A2116; box-shadow:0 10px 30px -12px rgba(224,163,94,.85)}
.btn-key:hover{background:var(--key-lift); transform:translateY(-2px)}
.btn-ghost{border-color:rgba(229,229,229,.32); color:var(--chalk)}
.btn-ghost:hover{border-color:var(--key); color:var(--key); transform:translateY(-2px)}
.btn .arw{transition:transform .25s var(--ease)}
.btn:hover .arw{transform:translateX(4px)}

/* key-teeth rule: the one decorative motif, used once */
.teeth{
  height:9px; width:100%;
  background:repeating-linear-gradient(90deg,
    var(--key) 0 7px, transparent 7px 12px, var(--key) 12px 15px, transparent 15px 26px);
  opacity:.55;
}

/* ============================================================
   NAV
   ============================================================ */
.nav{
  position:sticky; top:0; z-index:100;
  background:rgba(56,67,79,.72); backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid transparent; transition:border-color .3s, background .3s;
}
.nav.stuck{border-bottom-color:var(--line-dark); background:rgba(45,54,65,.88)}
.nav-in{max-width:var(--maxw); margin:0 auto; padding:14px var(--gut);
  display:flex; align-items:center; justify-content:space-between; gap:20px}
.brand{display:flex; align-items:center; gap:12px; text-decoration:none}
.mark{background:var(--mark) center/contain no-repeat; flex:none}
.brand .mark{width:34px; height:36px; transition:transform .5s var(--ease)}
.brand:hover .mark{transform:translateY(-3px) rotate(-3deg)}
.brand span{font-family:var(--serif); font-weight:400; font-size:20px;
  letter-spacing:.32em; color:var(--key); padding-left:.32em}
.nav-links{display:flex; align-items:center; gap:28px}
.nav-links a{text-decoration:none; font-size:15px; color:rgba(237,239,242,.8);
  position:relative; padding-block:4px; transition:color .2s}
.nav-links a::after{content:""; position:absolute; left:0; bottom:0; height:1px; width:100%;
  background:var(--key); transform:scaleX(0); transform-origin:right; transition:transform .3s var(--ease)}
.nav-links a:hover{color:var(--chalk)}
.nav-links a:hover::after{transform:scaleX(1); transform-origin:left}
.nav-right a.btn{white-space:nowrap; flex:none}
.nav-right{display:flex; align-items:center; gap:16px}
.nav .btn{padding:11px 20px; font-size:14.5px}

/* language switcher */
.langs{display:flex; align-items:center; gap:2px; font-size:13px; font-weight:600; letter-spacing:.06em}
.langs a{text-decoration:none; padding:6px 9px; border-radius:8px; color:rgba(237,239,242,.5); transition:color .2s, background .2s}
.langs a:hover{color:var(--chalk); background:rgba(237,239,242,.07)}
.langs a[aria-current="true"]{color:var(--key); background:rgba(224,163,94,.13)}
.langs i{width:1px; height:13px; background:var(--line-dark); display:block}

.burger{display:none; background:none; border:0; padding:8px; cursor:pointer}
.burger i{display:block; width:22px; height:2px; background:var(--chalk); margin:4px 0;
  transition:transform .3s var(--ease), opacity .2s}
.burger[aria-expanded="true"] i:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger[aria-expanded="true"] i:nth-child(2){opacity:0}
.burger[aria-expanded="true"] i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.nav-links .mob-cta{display:none}

@media (max-width:980px){
  .nav-links{
    position:absolute; top:100%; left:0; right:0; flex-direction:column; align-items:stretch;
    gap:0; background:var(--ink); border-bottom:1px solid var(--line-dark);
    max-height:0; overflow:hidden; transition:max-height .4s var(--ease);
  }
  .nav-links.open{max-height:400px}
  .nav-links a{padding:16px var(--gut); border-bottom:1px solid var(--line-dark); font-size:16px}
  .nav-links a::after{display:none}
  .nav-links .mob-cta{display:block; color:var(--key); font-weight:600}
  .nav .btn{display:none}
  .burger{display:block}
}

/* ============================================================
   HERO
   ============================================================ */
.hero{position:relative; overflow:hidden; background:var(--slate)}
.hero::before{
  content:""; position:absolute; inset:-20% -10% auto -10%; height:130%;
  background:radial-gradient(58% 52% at 72% 30%, rgba(224,163,94,.15), transparent 68%),
             radial-gradient(46% 46% at 8% 88%, rgba(229,229,229,.07), transparent 70%);
  pointer-events:none;
}
.hero-grid{position:relative; display:grid; grid-template-columns:1.05fr .95fr;
  gap:clamp(36px,5vw,72px); align-items:center;
  padding-block:clamp(64px,9vw,116px) clamp(72px,10vw,124px)}
.hero h1{font-size:clamp(42px,6.4vw,80px); font-weight:500; margin:22px 0 0; max-width:13ch}
.hero h1 em{font-style:normal; color:var(--key); position:relative; white-space:nowrap}
.hero h1 em::after{content:""; position:absolute; left:0; right:0; bottom:.06em; height:3px;
  background:var(--key); opacity:.32; transform:scaleX(0); transform-origin:left;
  animation:sweep 1s .9s var(--ease) forwards}
@keyframes sweep{to{transform:scaleX(1)}}
.hero .lead{margin-top:24px}
.hero-cta{display:flex; flex-wrap:wrap; gap:14px; margin-top:34px}
.hero-note{margin-top:26px; font-size:14.5px; color:rgba(237,239,242,.55); max-width:44ch}

.reveal-up{opacity:0; transform:translateY(18px); animation:riseIn .9s var(--ease) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.18s}.d3{animation-delay:.31s}
.d4{animation-delay:.44s}.d5{animation-delay:.57s}
@keyframes riseIn{to{opacity:1; transform:none}}

/* ---------- signature: the search, played out ---------- */
.stage{position:relative; min-height:460px; display:flex; align-items:center; justify-content:center}
.stage-house{position:absolute; width:min(100%,460px); aspect-ratio:344/364; opacity:.13;
  filter:drop-shadow(0 0 60px rgba(0,0,0,.35)); animation:hover 9s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(-6px)}50%{transform:translateY(8px)}}
.msg{
  position:absolute; width:min(80%,368px);
  background:rgba(34,42,53,.86); border:1px solid var(--line-dark);
  border-radius:16px 16px 16px 4px; padding:14px 18px;
  font-size:15px; color:rgba(237,239,242,.62);
  box-shadow:0 24px 44px -28px rgba(0,0,0,.9);
  opacity:0; transform:translateY(26px) scale(.95) rotate(var(--r,0deg));
  transition:opacity .55s var(--ease), transform .55s var(--ease), filter .55s;
  backdrop-filter:blur(6px);
}
.msg small{display:block; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
  color:rgba(237,239,242,.34); margin-bottom:5px}
.msg.in{opacity:1; transform:translateY(0) scale(1) rotate(var(--r,0deg))}
.msg.out{opacity:0; transform:translateY(-18px) scale(.94) rotate(var(--r,0deg)); filter:blur(3px)}
.m0{top:0%;   left:0%;  --r:-3.4deg}
.m1{top:17%;  left:22%; --r:2.6deg}
.m2{top:35%;  left:6%;  --r:-1.6deg}
.m3{top:53%;  left:26%; --r:3.2deg}
.m4{top:72%;  left:11%; --r:-2.4deg}

.keys{
  position:absolute; top:24%; left:10%; width:min(90%,400px);
  background:linear-gradient(158deg,#F6F7F9,#E4E8ED);
  color:var(--ink); border-radius:20px; padding:24px 26px 22px;
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 40px 70px -34px rgba(0,0,0,.95), 0 0 0 6px rgba(224,163,94,.10);
  opacity:0; transform:translateY(34px) scale(.95);
  transition:opacity .7s var(--ease), transform .7s var(--ease);
}
.keys.in{opacity:1; transform:none}
.keys-top{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:16px}
.keys-tag{font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:#8A6A3C; background:rgba(224,163,94,.20); padding:5px 11px; border-radius:99px; white-space:nowrap}
.keys h3{font-size:24px; font-weight:600; color:var(--ink)}
.keys .addr{font-size:14px; color:#5E6874; margin-top:3px}
.keys ul{list-style:none; margin:18px 0 0; padding:0; display:grid; gap:9px}
.keys li{display:flex; align-items:flex-start; gap:10px; font-size:14.5px; color:#3A4553}
.keys li svg{flex:none; margin-top:3px}
.keys-foot{margin-top:18px; padding-top:15px; border-top:1px dashed rgba(34,42,53,.18);
  display:flex; align-items:center; justify-content:space-between; font-size:13px; color:#6C7684}
.keys-foot b{font-family:var(--display); font-size:15px; color:var(--ink); font-weight:600}

/* ============================================================
   TICKER
   ============================================================ */
.reality{background:var(--slate-deep); border-block:1px solid var(--line-dark)}
.ticker{overflow:hidden; padding-block:20px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker-track{display:flex; width:max-content; animation:slide 46s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.ticker-track span{display:inline-flex; align-items:center; gap:14px; padding-inline:26px;
  font-size:15px; color:rgba(237,239,242,.45); white-space:nowrap}
.ticker-track span::after{content:""; width:5px; height:5px; border-radius:99px; background:var(--key); opacity:.5}

.reality-say{padding-block:clamp(56px,7vw,86px); display:grid; grid-template-columns:1fr 1fr;
  gap:clamp(28px,4vw,60px); align-items:end}
.reality-say h2{font-size:clamp(28px,3.6vw,44px); font-weight:500; max-width:15ch}
.reality-say p{color:rgba(237,239,242,.7)}

/* ============================================================
   LIGHT SECTIONS
   ============================================================ */
.light{background:var(--chalk); color:var(--ink)}
.light .lead{color:#525E6D}
.light .eyebrow{color:var(--key-dark)}
.light .eyebrow::before{background:var(--key-dark)}
.sec-head{max-width:64ch}
.sec-head h2{font-size:clamp(30px,4.2vw,52px); font-weight:500; margin:18px 0 20px}

/* what we do */
.do-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:22px; margin-top:clamp(38px,5vw,60px)}
.do-card{background:#fff; border:1px solid var(--line-light); border-radius:20px;
  padding:30px 28px 32px; position:relative; overflow:hidden;
  transition:transform .4s var(--ease), box-shadow .4s var(--ease), border-color .4s}
.do-card::after{content:""; position:absolute; inset:auto 0 0 0; height:3px; background:var(--key);
  transform:scaleX(0); transform-origin:left; transition:transform .45s var(--ease)}
.do-card:hover{transform:translateY(-6px); box-shadow:0 30px 50px -34px rgba(34,42,53,.55); border-color:transparent}
.do-card:hover::after{transform:scaleX(1)}
.do-icon{width:46px; height:46px; border-radius:13px; display:grid; place-items:center;
  background:rgba(224,163,94,.16); color:var(--key-dark); margin-bottom:20px}
.do-card h3{font-size:21px; font-weight:600; margin-bottom:10px}
.do-card p{font-size:15.5px; color:#525E6D; line-height:1.62}

/* how it works — a real sequence, so it is numbered */
.steps{position:relative; margin-top:clamp(38px,5vw,64px)}
.steps-line{position:absolute; left:27px; top:14px; bottom:40px; width:2px; background:rgba(237,239,242,.14)}
.steps-line i{position:absolute; inset:0 0 auto 0; height:0;
  background:linear-gradient(180deg,var(--key),rgba(224,163,94,.25)); transition:height .2s linear}
.step{display:grid; grid-template-columns:56px 1fr; gap:26px; padding-block:26px; align-items:start}
.step-n{width:56px; height:56px; border-radius:99px; display:grid; place-items:center;
  border:1px solid var(--line-dark); background:var(--slate-deep);
  font-family:var(--display); font-size:15px; font-weight:600;
  color:rgba(237,239,242,.6); position:relative; z-index:2; transition:all .45s var(--ease)}
.step.seen .step-n{border-color:var(--key); color:var(--key); background:var(--slate);
  box-shadow:0 0 0 6px rgba(224,163,94,.10)}
.step h3{font-size:clamp(20px,2.2vw,26px); font-weight:500; margin-bottom:9px}
.step p{color:rgba(237,239,242,.66); max-width:56ch; font-size:16px}

/* cities */
.cities{display:flex; flex-wrap:wrap; gap:10px; margin-top:34px}
.city{padding:10px 18px; border-radius:99px; border:1px solid var(--line-light);
  font-size:15px; background:#fff; transition:all .3s var(--ease); cursor:default}
.city:hover{border-color:var(--key); color:#8A6A3C; transform:translateY(-2px)}
.city.ask{background:rgba(224,163,94,.14); border-color:rgba(224,163,94,.4); color:#8A6A3C; font-weight:500}

/* safety */
.safe-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:0 clamp(30px,5vw,70px); margin-top:clamp(34px,4vw,52px)}
.safe{display:flex; gap:16px; padding-block:24px; border-top:1px solid var(--line-dark)}
.safe svg{flex:none; margin-top:2px; color:var(--key)}
.safe h4{font-size:17.5px; font-weight:600; margin-bottom:6px; letter-spacing:-.01em}
.safe p{font-size:15.5px; color:rgba(237,239,242,.62)}

/* testimonials */
.quotes{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:clamp(38px,5vw,58px)}
.quote{background:#fff; border:1px solid var(--line-light); border-radius:20px;
  padding:30px 28px 26px; display:flex; flex-direction:column;
  transition:transform .4s var(--ease), box-shadow .4s var(--ease)}
.quote:hover{transform:translateY(-5px); box-shadow:0 28px 48px -34px rgba(34,42,53,.5)}
.quote::before{content:"”"; font-family:var(--serif); font-size:62px; line-height:.6;
  color:var(--key); display:block; margin-bottom:14px; height:26px}
.quote p{font-size:16.5px; color:#3A4553; line-height:1.6; flex:1}
.quote footer{margin-top:22px; padding-top:18px; border-top:1px solid var(--line-light);
  font-size:14px; color:#6C7684}
.quote footer b{display:block; font-family:var(--display); font-weight:600; font-size:15.5px; color:var(--ink)}

/* pull quote — the only place the serif runs large */
.pull{padding-block:clamp(60px,8vw,100px); text-align:center}
.pull p{font-family:var(--serif); font-weight:300; font-size:clamp(28px,4.6vw,54px);
  line-height:1.22; max-width:20ch; margin:0 auto; color:var(--chalk)}
.pull p b{font-weight:400; color:var(--key)}

/* faq */
.faq{margin-top:clamp(34px,4vw,52px); border-top:1px solid var(--line-light)}
.faq-item{border-bottom:1px solid var(--line-light)}
.faq-q{width:100%; background:none; border:0; text-align:left; cursor:pointer;
  padding:24px 44px 24px 0; position:relative;
  font-family:var(--display); font-size:clamp(17px,1.9vw,20px); font-weight:500;
  letter-spacing:-.01em; transition:color .25s}
.faq-q:hover{color:var(--key-dark)}
.faq-q::after,.faq-q::before{content:""; position:absolute; right:8px; top:50%;
  background:currentColor; transition:transform .35s var(--ease), opacity .3s}
.faq-q::before{width:15px; height:1.5px; transform:translateY(-50%)}
.faq-q::after{width:1.5px; height:15px; transform:translate(7px,-50%)}
.faq-item.open .faq-q::after{transform:translate(7px,-50%) rotate(90deg); opacity:0}
.faq-item.open .faq-q{color:var(--key-dark)}
.faq-a{display:grid; grid-template-rows:0fr; transition:grid-template-rows .4s var(--ease)}
.faq-item.open .faq-a{grid-template-rows:1fr}
.faq-a > div{overflow:hidden}
.faq-a p{padding-bottom:26px; color:#525E6D; font-size:16px; max-width:70ch}

/* contact */
.contact{background:var(--ink)}
.contact-h{font-size:clamp(30px,4.2vw,48px); font-weight:500; margin:18px 0 20px}
.contact-grid{display:grid; grid-template-columns:.95fr 1.05fr; gap:clamp(36px,6vw,80px); align-items:start}
.form{display:grid; gap:16px}
.field{display:grid; gap:7px}
.field label{font-size:13px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:rgba(237,239,242,.5)}
.field input,.field select,.field textarea{
  font:inherit; font-size:16px; color:var(--chalk);
  background:rgba(237,239,242,.05); border:1px solid var(--line-dark);
  border-radius:12px; padding:14px 16px; width:100%; transition:border-color .25s, background .25s}
.field textarea{resize:vertical; min-height:118px}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--key); background:rgba(237,239,242,.08); outline:none}
.field select{appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--key) 50%),linear-gradient(135deg,var(--key) 50%,transparent 50%);
  background-position:calc(100% - 20px) 22px, calc(100% - 14px) 22px;
  background-size:6px 6px; background-repeat:no-repeat}
.field select option{background:var(--ink)}
.two{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.form-note{font-size:13.5px; color:rgba(237,239,242,.45)}

.channels{display:grid; gap:14px; margin-top:30px}
.chan{display:flex; align-items:center; gap:15px; text-decoration:none;
  padding:17px 20px; border:1px solid var(--line-dark); border-radius:15px;
  transition:border-color .3s, transform .3s var(--ease), background .3s}
.chan:hover{border-color:var(--key); transform:translateX(4px); background:rgba(224,163,94,.06)}
.chan svg{flex:none; color:var(--key)}
.chan b{display:block; font-family:var(--display); font-weight:500; font-size:16.5px}
.chan span{font-size:14px; color:rgba(237,239,242,.55)}
.chan-primary{border-color:rgba(224,163,94,.45); background:rgba(224,163,94,.08)}

/* floating call to action */
.wa{
  position:fixed; right:clamp(16px,3vw,28px); bottom:clamp(16px,3vw,28px); z-index:120;
  display:inline-flex; align-items:center; gap:10px; text-decoration:none;
  background:var(--key); color:#2A2116; font-weight:600; font-size:15px;
  padding:14px 20px; border-radius:999px;
  box-shadow:0 16px 36px -14px rgba(0,0,0,.7), 0 0 0 6px rgba(224,163,94,.12);
  opacity:0; transform:translateY(18px) scale(.94); pointer-events:none;
  transition:opacity .4s var(--ease), transform .4s var(--ease), background .25s;
}
.wa.show{opacity:1; transform:none; pointer-events:auto}
.wa:hover{background:var(--key-lift)}
@media (max-width:560px){ .wa span{display:none} .wa{padding:15px; border-radius:99px} }

/* footer */
.foot{background:var(--slate-deep); border-top:1px solid var(--line-dark)}
.foot-in{display:flex; flex-wrap:wrap; gap:32px; justify-content:space-between;
  align-items:flex-start; padding-block:56px 30px}
.foot-brand .mark{width:64px; height:68px; margin-bottom:18px}
.foot-brand p{font-family:var(--serif); font-size:22px; color:rgba(237,239,242,.7); max-width:22ch; line-height:1.35}
.foot-nav{display:flex; gap:clamp(28px,5vw,70px); flex-wrap:wrap}
.foot-col h5{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--key);
  margin:0 0 14px; font-weight:600; font-family:var(--body)}
.foot-col a,.foot-col p{display:block; text-decoration:none; font-size:15px;
  color:rgba(237,239,242,.62); margin-bottom:9px; transition:color .2s}
.foot-col a:hover{color:var(--key)}
.foot-bot{display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between;
  padding-block:22px 34px; border-top:1px solid var(--line-dark); font-size:13.5px; color:rgba(237,239,242,.4)}

/* scroll reveal */
[data-rev]{opacity:0; transform:translateY(26px);
  transition:opacity .8s var(--ease), transform .8s var(--ease)}
[data-rev].seen{opacity:1; transform:none}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr}
  .stage{min-height:430px; margin-top:8px}
  .reality-say{grid-template-columns:1fr; align-items:start}
  .do-grid{grid-template-columns:1fr}
  .safe-grid{grid-template-columns:1fr}
  .quotes{grid-template-columns:1fr}
  .contact-grid{grid-template-columns:1fr}
}
@media (max-width:560px){
  body{font-size:16px}
  .step{grid-template-columns:44px 1fr; gap:18px}
  .step-n{width:44px; height:44px; font-size:13px}
  .steps-line{left:21px}
  .two{grid-template-columns:1fr}
  .msg{width:min(92%,300px); font-size:14px; padding:12px 15px}
  .keys{width:min(96%,330px); left:2%; padding:20px}
  .keys-top{flex-direction:column; align-items:flex-start; gap:10px}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
  [data-rev]{opacity:1; transform:none}
  .reveal-up{opacity:1; transform:none}
}

/* ============================================================
   SUB-PAGES — application form, payment, terms
   ============================================================ */
.page-head{padding-block:clamp(48px,7vw,88px) clamp(30px,4vw,44px); position:relative}
.page-head h1{font-size:clamp(34px,5.2vw,60px); font-weight:500; margin:20px 0 18px; max-width:16ch}
.back{display:inline-flex; align-items:center; gap:8px; text-decoration:none; font-size:14.5px;
  color:rgba(237,239,242,.55); transition:color .25s, transform .25s var(--ease)}
.back:hover{color:var(--key); transform:translateX(-3px)}

/* two-column apply layout */
.apply-grid{display:grid; grid-template-columns:1.08fr .92fr; gap:clamp(30px,4.5vw,64px);
  align-items:start; padding-bottom:clamp(70px,9vw,120px)}
.fieldset{border:0; margin:0 0 34px; padding:0}
.fs-title{display:flex; align-items:baseline; gap:12px; margin:0 0 20px;
  padding-bottom:12px; border-bottom:1px solid var(--line-dark)}
.fs-title b{font-family:var(--display); font-size:19px; font-weight:600; letter-spacing:-.01em}
.fs-title span{font-size:13.5px; color:rgba(237,239,242,.45)}
.hint{font-size:13px; color:rgba(237,239,242,.42); margin-top:-2px}
.field input[type="number"]{-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.euro{position:relative}
.euro input{padding-left:34px}
.euro::before{content:"€"; position:absolute; left:16px; top:50%; transform:translateY(-50%);
  color:var(--key); font-size:16px; pointer-events:none; z-index:1}
.field.euro{position:relative}
.field.euro::before{top:auto; bottom:15px; transform:none}

/* personality chips */
.chips{display:flex; flex-wrap:wrap; gap:9px}
.chip{padding:9px 16px; border-radius:999px; border:1px solid var(--line-dark);
  background:transparent; color:rgba(237,239,242,.72); font-size:14.5px; cursor:pointer;
  transition:all .25s var(--ease)}
.chip:hover{border-color:rgba(224,163,94,.5); color:var(--chalk)}
.chip[aria-pressed="true"]{background:rgba(224,163,94,.16); border-color:var(--key); color:var(--key); font-weight:500}
.chip[disabled]{opacity:.32; cursor:not-allowed}

/* checkbox rows */
.checkrow{display:flex; align-items:flex-start; gap:13px; padding:13px 0; cursor:pointer}
.checkrow input{position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0;
  overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap}
.box{flex:none; width:21px; height:21px; border-radius:6px; border:1.5px solid rgba(237,239,242,.3);
  margin-top:2px; display:grid; place-items:center; transition:all .22s var(--ease)}
.box svg{opacity:0; transform:scale(.5); transition:all .22s var(--ease)}
.checkrow input:checked + .box{background:var(--key); border-color:var(--key)}
.checkrow input:checked + .box svg{opacity:1; transform:none}
.checkrow input:focus-visible + .box{outline:2px solid var(--key); outline-offset:3px}
.checkrow span{font-size:15.5px; color:rgba(237,239,242,.78); line-height:1.5}
.checkrow a{color:var(--key); text-underline-offset:3px}
.checkrow.legal span{font-size:14.5px; color:rgba(237,239,242,.62)}

/* live letter preview */
.rail{position:sticky; top:96px; display:grid; gap:18px}
.preview{background:#F6F7F9; color:var(--ink); border-radius:20px; overflow:hidden;
  border:1px solid rgba(255,255,255,.6); box-shadow:0 40px 70px -40px rgba(0,0,0,.85)}
.preview-bar{display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 20px; background:#E7EBEF; border-bottom:1px solid rgba(34,42,53,.1)}
.preview-bar b{font-family:var(--display); font-size:14px; font-weight:600; color:var(--ink)}
.copy{background:none; border:1px solid rgba(34,42,53,.2); border-radius:99px; padding:6px 13px;
  font-size:12.5px; font-weight:600; color:#4A5666; cursor:pointer; transition:all .25s var(--ease)}
.copy:hover{border-color:var(--key-dark); color:var(--key-dark)}
.preview pre{margin:0; padding:22px 24px 26px; max-height:min(56vh,620px); overflow:auto;
  font-family:var(--body); font-size:14.2px; line-height:1.62; color:#2F3945;
  white-space:pre-wrap; word-break:break-word}
.preview .ph{color:#A7B0BB}

/* payment card */
.pay{background:linear-gradient(158deg,rgba(224,163,94,.14),rgba(224,163,94,.05));
  border:1px solid rgba(224,163,94,.34); border-radius:20px; padding:26px 26px 28px}
.pay-top{display:flex; align-items:baseline; gap:12px; margin-bottom:6px}
.pay-top b{font-family:var(--display); font-size:38px; font-weight:600; color:var(--key); letter-spacing:-.03em}
.pay-top span{font-size:14px; color:rgba(237,239,242,.6)}
.pay > p{font-size:14.5px; color:rgba(237,239,242,.66)}
.pay ul{list-style:none; margin:18px 0 22px; padding:0; display:grid; gap:10px}
.pay li{display:flex; gap:11px; font-size:14.5px; color:rgba(237,239,242,.8); line-height:1.5}
.pay li svg{flex:none; margin-top:4px; color:var(--key)}
.pay .btn{width:100%; justify-content:center}
.pay-note{margin-top:14px; font-size:12.8px; color:rgba(237,239,242,.45); text-align:center; line-height:1.55}

/* reference panel */
.refbox{margin:26px auto 0; max-width:340px}
.refbox-lead{font-size:13.5px; color:var(--key); font-weight:600; margin-bottom:10px; line-height:1.5}
.refbox-btn{display:flex; align-items:center; justify-content:center; gap:12px; width:100%;
  background:rgba(224,163,94,.12); border:1.5px dashed rgba(224,163,94,.55); border-radius:14px;
  padding:15px 18px; cursor:pointer; transition:background .2s var(--ease), border-color .2s var(--ease)}
.refbox-btn:hover{background:rgba(224,163,94,.2); border-color:var(--key)}
.refbox-btn:focus-visible{outline:2px solid var(--key); outline-offset:3px}
.refbox-code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:19px;
  font-weight:600; letter-spacing:.06em; color:var(--key-lift)}
.refbox-icon{display:grid; place-items:center; color:rgba(224,163,94,.75); flex:none}
.refbox-btn.copied{background:rgba(126,196,140,.16); border-style:solid; border-color:rgba(126,196,140,.7)}
.refbox-btn.copied .refbox-code{color:#A9DDB5}
.refbox-btn.copied .refbox-icon{color:#A9DDB5}
.refbox-hint{margin-top:9px; font-size:12.5px; color:rgba(237,239,242,.5); line-height:1.5}
.refbox-hint.ok{color:#A9DDB5}
.err{color:#F0A9A9; font-size:14px; margin-top:12px; display:none}
.err.show{display:block}

/* success page */
.done{max-width:660px; margin-inline:auto; text-align:center; padding-block:clamp(70px,10vw,130px)}
.done .tick{width:74px; height:74px; border-radius:99px; margin:0 auto 30px; display:grid; place-items:center;
  background:rgba(224,163,94,.16); border:1px solid rgba(224,163,94,.4); color:var(--key)}
.done h1{font-size:clamp(30px,4.4vw,46px); font-weight:500; margin-bottom:18px}
.done p{color:rgba(237,239,242,.7); margin-bottom:14px}
.done .next{text-align:left; margin-top:38px; border-top:1px solid var(--line-dark); padding-top:28px}
.done .next h3{font-size:18px; font-weight:600; margin-bottom:14px}
.done ol{margin:0; padding-left:20px; color:rgba(237,239,242,.7); display:grid; gap:9px; font-size:15.5px}
.fallback{display:none; text-align:left; margin-top:30px}
.fallback.show{display:block}
.fallback textarea{width:100%; min-height:250px; font:inherit; font-size:13.5px; line-height:1.6;
  background:rgba(237,239,242,.05); color:var(--chalk); border:1px solid var(--line-dark);
  border-radius:14px; padding:16px}

/* notice box */
.notice{background:rgba(224,163,94,.1); border:1px solid rgba(224,163,94,.3);
  border-radius:16px; padding:20px 22px; font-size:15px; color:rgba(237,239,242,.8); line-height:1.6}
.notice b{color:var(--key)}

/* ---------- terms page ---------- */
.legal{padding-block:clamp(40px,5vw,60px) clamp(70px,9vw,120px)}
.legal-grid{display:grid; grid-template-columns:250px 1fr; gap:clamp(32px,5vw,72px); align-items:start}
.toc{position:sticky; top:100px; font-size:14.5px}
.toc h4{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--key-dark);
  font-family:var(--body); font-weight:600; margin:0 0 14px}
.toc a{display:block; text-decoration:none; color:#5A6675; padding:5px 0; transition:color .2s}
.toc a:hover{color:var(--key-dark)}
.legal-body{max-width:74ch}
.summary{background:#fff; border:1px solid var(--line-light); border-left:3px solid var(--key);
  border-radius:14px; padding:26px 28px; margin-bottom:44px}
.summary h3{font-size:17px; font-weight:600; margin-bottom:14px}
.summary ul{margin:0; padding-left:19px; display:grid; gap:9px; color:#4A5666; font-size:15.5px; line-height:1.55}
.legal-body h2{font-size:clamp(21px,2.4vw,26px); font-weight:600; margin:44px 0 14px; scroll-margin-top:100px}
.legal-body h2:first-of-type{margin-top:0}
.legal-body h3{font-size:17px; font-weight:600; margin:26px 0 10px}
.legal-body p{margin-bottom:14px; color:#3E4956; font-size:16px; line-height:1.68}
.legal-body ul,.legal-body ol{margin:0 0 18px; padding-left:22px; color:#3E4956; font-size:16px; line-height:1.68}
.legal-body li{margin-bottom:8px}
.legal-body table{width:100%; border-collapse:collapse; margin-bottom:20px; font-size:15px}
.legal-body th,.legal-body td{text-align:left; padding:11px 12px; border-bottom:1px solid var(--line-light); vertical-align:top}
.legal-body th{font-weight:600; color:var(--ink); width:34%}
.legal-body td{color:#4A5666}
.legal-meta{font-size:14px; color:#6C7684; padding-top:26px; margin-top:40px; border-top:1px solid var(--line-light)}

@media (max-width:980px){
  .apply-grid{grid-template-columns:1fr}
  .rail{position:static; order:-1}
  .preview pre{max-height:340px}
  .legal-grid{grid-template-columns:1fr}
  .toc{position:static; border-bottom:1px solid var(--line-light); padding-bottom:18px}
  .toc a{display:inline-block; margin-right:18px}
}


/* panel */
.pn-login{max-width:400px; margin:clamp(40px,9vw,90px) auto 0}
.pn-login h1{font-family:var(--display); font-size:29px; font-weight:500; letter-spacing:-.02em; margin-bottom:8px}
.pn-login p.sub{font-size:15px; color:rgba(237,239,242,.6); line-height:1.6; margin-bottom:26px}
.pn-f{margin-bottom:16px}
.pn-f label{display:block; font-size:12px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:rgba(237,239,242,.6); margin-bottom:7px}
.pn-f input{width:100%; box-sizing:border-box; background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.13); border-radius:11px; padding:13px 15px;
  font:inherit; color:var(--chalk); outline:none}
.pn-f input:focus{border-color:rgba(224,163,94,.55)}
.pn-msg{display:none; margin-top:14px; font-size:14px; line-height:1.55; padding:11px 14px; border-radius:10px}
.pn-msg.show{display:block}
.pn-msg.err{background:rgba(196,102,106,.14); color:#F4A9A9}
.pn-bar{display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid rgba(255,255,255,.1);
  margin-bottom:22px; flex-wrap:wrap}
.pn-who{font-size:13px; color:rgba(237,239,242,.6)}
.pn-role{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  padding:3px 9px; border-radius:999px; background:rgba(224,163,94,.16); color:var(--key)}
.pn-role.staff{background:rgba(132,170,188,.18); color:#A9CBDB}
.pn-out{margin-left:auto; background:none; border:1px solid rgba(255,255,255,.14); border-radius:9px;
  padding:7px 14px; font-size:13px; color:rgba(237,239,242,.75); cursor:pointer}
.pn-out:hover{color:#fff; border-color:rgba(224,163,94,.4)}
.pn-tools{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap}
.pn-tools select,.pn-tools input{background:rgba(0,0,0,.2); border:1px solid rgba(255,255,255,.13);
  border-radius:10px; padding:9px 12px; font:inherit; color:var(--chalk); outline:none}
.pn-tools input[type=search]{flex:1; min-width:200px}
.pn-rows{display:grid; gap:9px}
.pn-row{display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:13px 16px;
  background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.08); border-radius:12px; cursor:pointer}
.pn-row:hover{border-color:rgba(224,163,94,.35)}
.pn-row.on{border-color:var(--key); background:rgba(224,163,94,.1)}
.pn-row .nm{font-weight:600; font-size:15px}
.pn-row .rf{font-family:ui-monospace,Menlo,monospace; font-size:12.6px; color:var(--key); letter-spacing:.04em}
.pn-row .mt{grid-column:1/-1; font-size:12.6px; color:rgba(237,239,242,.45)}
.pn-pill{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  padding:3px 9px; border-radius:999px; white-space:nowrap; height:fit-content}
.pn-pill.paid{background:rgba(143,211,163,.16); color:#8FD3A3}
.pn-pill.pending{background:rgba(242,204,143,.16); color:#F2CC8F}
.pn-pill.failed,.pn-pill.expired,.pn-pill.refunded{background:rgba(240,169,169,.14); color:#F0A9A9}
.pn-pill.online,.pn-pill.express{background:rgba(224,163,94,.16); color:var(--key)}
.pn-detail{margin-top:26px; padding-top:22px; border-top:1px solid rgba(255,255,255,.1)}
.pn-detail table{width:100%; border-collapse:collapse; font-size:14.4px}
.pn-detail td{padding:8px 0; border-top:1px solid rgba(255,255,255,.07); vertical-align:top}
.pn-detail td:first-child{color:rgba(237,239,242,.45); width:42%; padding-right:14px}
.pn-docs{margin-top:22px; padding-top:18px; border-top:1px solid rgba(255,255,255,.1)}
.pn-doc{display:flex; align-items:center; gap:12px; padding:10px 13px; border-radius:10px;
  background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.09); margin-bottom:8px}
.pn-doc .n{flex:1; font-size:13.8px; word-break:break-all}
.pn-doc .k{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--key);
  background:rgba(224,163,94,.14); padding:2px 8px; border-radius:999px}
.pn-doc .s{font-size:12.3px; color:rgba(237,239,242,.45); white-space:nowrap}
.pn-doc a,.pn-doc button{font-size:12.7px; color:var(--key); background:none; border:none;
  cursor:pointer; text-decoration:none; white-space:nowrap; padding:0}
.pn-doc button.del{color:#F0A9A9}
.pn-up{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px}
.pn-up select,.pn-up input[type=file]{color:var(--chalk); background:rgba(0,0,0,.2);
  border:1px solid rgba(255,255,255,.13); border-radius:10px; padding:8px 11px; font:inherit}
.pn-note{font-size:13px; color:rgba(237,239,242,.5); line-height:1.6; margin-top:12px}

/* two-pane console, mirroring the local admin */
/* The panel is a full-screen console, so the marketing header and footer are
   hidden while it is open. They stay in place on the login screen, which is the
   one moment somebody might want to get back to the site. */
body.pn-active .nav,body.pn-active header,body.pn-active .foot,
body.pn-active footer,body.pn-active .wa{display:none !important}
body.pn-active main.wrap{padding:0 !important; max-width:none !important}
body.pn-active{overflow:hidden}
.pn-shell{position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
  background:var(--slate)}
.pn-hd{display:flex; align-items:center; gap:14px; padding:12px 20px; background:#3A4553;
  border-bottom:1px solid rgba(255,255,255,.1); flex:none; flex-wrap:wrap}
.pn-brand{font-size:14px; font-weight:700; letter-spacing:.17em; color:var(--key)}
.pn-stats{margin-left:auto; display:flex; gap:16px; font-size:12.8px; color:rgba(237,239,242,.6)}
.pn-stats b{color:#fff}
.pn-stats .warn{color:#F2CC8F}
.pn-tb{display:flex; gap:9px; padding:11px 20px; border-bottom:1px solid rgba(255,255,255,.1);
  flex:none; flex-wrap:wrap}
.pn-main{flex:1; display:grid; grid-template-columns:minmax(320px,38%) 1fr; overflow:hidden}
@media (max-width:900px){ .pn-main{grid-template-columns:1fr} .pn-pane{display:none} .pn-pane.open{display:block} }
.pn-list{overflow-y:auto; border-right:1px solid rgba(255,255,255,.1)}
.pn-pane{overflow-y:auto; padding:22px 24px 70px}
.pn-r{padding:12px 20px; border-bottom:1px solid rgba(237,239,242,.055); cursor:pointer;
  display:grid; grid-template-columns:1fr auto; gap:3px 10px; align-items:center}
.pn-r:hover{background:rgba(255,255,255,.035)}
.pn-r.sel{background:rgba(224,163,94,.12); box-shadow:inset 3px 0 0 var(--key)}
.pn-r .nm{font-weight:600; font-size:14.5px}
.pn-r .rf{font-family:ui-monospace,Menlo,monospace; font-size:12.4px; color:var(--key); letter-spacing:.04em}
.pn-r .mt{grid-column:1/-1; font-size:12.4px; color:rgba(237,239,242,.42)}
.pn-r .fl{grid-column:1/-1; font-size:11.5px; color:#F2CC8F}
.pn-empty{display:grid; place-items:center; height:100%; color:rgba(237,239,242,.4);
  text-align:center; padding:40px; line-height:1.6}
.pn-h2{font-size:21px; font-weight:600; letter-spacing:-.01em}
.pn-refbig{display:flex; align-items:center; gap:10px; margin:12px 0 18px; flex-wrap:wrap}
.pn-refbig code{font-family:ui-monospace,Menlo,monospace; font-size:19px; font-weight:700;
  color:#F0BE80; letter-spacing:.06em; background:rgba(224,163,94,.12);
  border:1px dashed rgba(224,163,94,.45); padding:8px 14px; border-radius:11px}
.pn-cp{background:transparent; border:1px solid rgba(255,255,255,.14); border-radius:9px;
  padding:7px 12px; cursor:pointer; font-size:12.7px; color:rgba(237,239,242,.7)}
.pn-cp:hover{color:#fff; border-color:rgba(224,163,94,.4)}
.pn-cp.done{color:#8FD3A3; border-color:rgba(143,211,163,.45)}
.pn-sec{margin-top:24px}
.pn-sec h3{font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--key); margin-bottom:10px}
.pn-t{width:100%; border-collapse:collapse; font-size:14px}
.pn-t td{padding:7px 0; border-top:1px solid rgba(237,239,242,.07); vertical-align:top;
  color:var(--chalk)}
.pn-t td:first-child{color:rgba(237,239,242,.42); width:42%; padding-right:14px}
.pn-pre{background:rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.1); border-radius:11px;
  padding:14px; font:12.5px/1.6 ui-monospace,Menlo,monospace; white-space:pre-wrap;
  word-break:break-word; color:rgba(237,239,242,.72); max-height:300px; overflow:auto}
.pn-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
@media (max-width:1150px){ .pn-grid{grid-template-columns:1fr} }
.pn-grid .wide{grid-column:1/-1}
.pn-grid label{display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:rgba(237,239,242,.42); margin-bottom:4px}
.pn-in{width:100%; box-sizing:border-box; color:var(--chalk); background:rgba(0,0,0,.2);
  border:1px solid rgba(255,255,255,.13); border-radius:9px; padding:8px 11px; font:inherit; outline:none}
.pn-in:focus{border-color:rgba(224,163,94,.5)}
textarea.pn-in{min-height:60px; resize:vertical}
.pn-acts{display:flex; gap:9px; flex-wrap:wrap; margin-top:12px}
.pn-b{background:var(--key); color:#222A35; border:none; border-radius:9px; padding:9px 16px;
  font-weight:650; font-size:14px; cursor:pointer}
.pn-b:hover{background:#F0BE80}
.pn-b.gh{background:transparent; color:var(--chalk); border:1px solid rgba(255,255,255,.14)}
.pn-b.gh:hover{background:rgba(255,255,255,.06)}
.pn-b.rd{background:rgba(240,169,169,.16); color:#F0A9A9; border:1px solid rgba(240,169,169,.4)}
.pn-b:disabled{opacity:.5; cursor:default}
.pn-msg2{display:none; margin-top:10px; font-size:13.2px; padding:10px 13px; border-radius:9px; line-height:1.55}
.pn-msg2.show{display:block}
.pn-msg2.ok{background:rgba(143,211,163,.13); color:#8FD3A3}
.pn-msg2.err{background:rgba(240,169,169,.12); color:#F0A9A9}
.pn-danger{margin-top:12px; border:1px solid rgba(240,169,169,.3); border-radius:11px;
  padding:14px 16px; background:rgba(240,169,169,.05)}
.pn-danger h4{font-size:13px; color:#F0A9A9; margin-bottom:5px}
.pn-inline{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
.pn-inline .pn-in{flex:1; min-width:180px}
.pn-modal{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; place-items:center; z-index:60}
.pn-modal.open{display:grid}
.pn-modal .bx{background:#3A4553; border:1px solid rgba(255,255,255,.12); border-radius:16px;
  padding:22px 24px; width:min(640px,92vw); max-height:88vh; overflow:auto}
/* case closed: dimmed rather than hidden, and reversible */
.pn-r.archived{opacity:.55; background:repeating-linear-gradient(135deg,
  transparent, transparent 8px, rgba(255,255,255,.03) 8px, rgba(255,255,255,.03) 16px)}
.pn-r.archived .nm::after{content:' archived'; color:#F2CC8F; font-size:11px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; margin-left:7px}
.pn-r.closed{opacity:.42}
.pn-r.closed .nm::after{content:' \2713 placed'; color:#8FD3A3; font-size:11.5px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; margin-left:7px}
.pn-r.closed:hover{opacity:.72}
.pn-tabs{display:flex; gap:4px; margin-right:6px}
.pn-tab{background:transparent; border:1px solid rgba(255,255,255,.12); border-radius:9px;
  padding:8px 15px; font-size:13.6px; font-weight:600; color:rgba(237,239,242,.65); cursor:pointer}
.pn-tab.on{background:rgba(224,163,94,.16); border-color:rgba(224,163,94,.5); color:var(--key)}
.pn-filters{display:flex; gap:8px; flex-wrap:wrap; padding:0 20px 11px;
  border-bottom:1px solid rgba(255,255,255,.1)}
.pn-filters .pn-in{width:auto; font-size:13.4px; padding:7px 10px}
.pn-filters .num{width:92px}
.pn-mailrow{display:grid; grid-template-columns:1fr auto; gap:5px 12px;
  padding:12px 20px; border-bottom:1px solid rgba(237,239,242,.055); cursor:pointer}
/* Tickboxes for choosing who a bulk email goes to. */
.pn-selbar{display:flex; align-items:center; gap:12px; padding:10px 20px;
  border-bottom:1px solid rgba(237,239,242,.09); font-size:12.8px; color:rgba(237,239,242,.55)}
.pn-selbar label{display:flex; align-items:center; gap:8px; cursor:pointer}
.pn-selbar input,.pn-bksel{width:15px; height:15px; accent-color:var(--key); cursor:pointer; flex:none}
.pn-mailrow .nm{display:flex; align-items:center; gap:9px}
.pn-mailrow:hover{background:rgba(255,255,255,.035)}
.pn-mailrow.sel{background:rgba(224,163,94,.12); box-shadow:inset 3px 0 0 var(--key)}
.pn-ticks{grid-column:1/-1; display:flex; gap:14px; flex-wrap:wrap; margin-top:3px}
.pn-tick{font-size:11.8px; display:flex; align-items:center; gap:5px; color:rgba(237,239,242,.38)}
.pn-tick.on{color:#8FD3A3}
.pn-tick.bad{color:#F0A9A9}
.pn-logline{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:baseline;
  padding:10px 0; border-top:1px solid rgba(237,239,242,.07); font-size:13.6px}
.pn-logkind{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  padding:2px 8px; border-radius:999px; background:rgba(224,163,94,.14); color:var(--key)}
.pn-logkind.failed{background:rgba(240,169,169,.16); color:#F0A9A9}
.pn-photos{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.pn-photo{margin:0; width:118px}
.pn-photo img{width:118px; height:118px; object-fit:cover; border-radius:11px; display:block;
  border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.2)}
.pn-photo figcaption{font-size:11.4px; color:rgba(237,239,242,.42); margin-top:5px;
  word-break:break-all; line-height:1.4}
.pn-photo .del{background:none; border:none; color:#F0A9A9; font-size:11.4px; cursor:pointer; padding:0}
#pnLapsed{position:fixed; left:0; right:0; bottom:0; z-index:80; display:flex; gap:16px;
  align-items:center; flex-wrap:wrap; padding:14px 20px; background:#3A4553;
  border-top:2px solid var(--key); box-shadow:0 -8px 24px rgba(0,0,0,.35);
  font-size:14px; color:var(--chalk)}
#pnLapsed b{color:var(--key)}
.pn-hint2{font-size:12.6px; color:rgba(237,239,242,.42); line-height:1.55; margin-top:7px}
</style>

</head>
<body>
<header class="nav" id="nav">
  <div class="nav-in">
    <a class="brand" href="/" aria-label="FastKeys, home">
      <span class="mark" aria-hidden="true"></span>
      <span>FASTKEYS</span>
    </a>
    <nav class="nav-links" id="navlinks">
      <a href="/">Home</a>
      <a href="/terms">Terms</a>
    </nav>
    <div class="nav-right">
      <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="navlinks">
        <i></i><i></i><i></i>
      </button>
    </div>
  </div>
</header>

<main class="wrap" style="padding-bottom:80px">

<div class="pn-login" id="loginView">
    <h1>Sign in</h1>
    <p class="sub">FastKeys staff only. This page is not linked from anywhere and is not indexed.</p>
    <form id="loginForm" novalidate>
      <div class="pn-f">
        <label for="pnEmail">Email</label>
        <input id="pnEmail" type="email" autocomplete="username" required>
      </div>
      <div class="pn-f">
        <label for="pnPass">Password</label>
        <input id="pnPass" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-key" style="width:100%; justify-content:center" id="pnGo">Sign in</button>
      <div class="pn-msg" id="pnMsg"></div>
    </form>
  </div>

    <div id="panelView" hidden>
    <div class="pn-shell">
      <div class="pn-hd">
        <span class="pn-brand">FASTKEYS</span>
        <span class="pn-role" id="pnRole"></span>
        <span class="pn-who" id="pnWho"></span>
        <div class="pn-stats" id="pnStats"></div>
        <button class="pn-b gh" id="pnOut" style="padding:7px 14px">Sign out</button>
      </div>

      <div class="pn-tb">
        <div class="pn-tabs">
          <button class="pn-tab on" data-view="clients">Clients</button>
          <button class="pn-tab" data-view="mail">Mail</button>
          <button class="pn-tab" data-view="listings">Noticeboard</button>
          <button class="pn-tab" data-view="archived">Archived</button>
        </div>
        <select id="pnKind" class="pn-in" style="width:auto">
          <option value="list">Applications</option>
          <option value="viewings">Viewings</option>
        </select>
        <select id="pnMailKind" class="pn-in" style="width:auto;display:none">
          <option value="clients">Clients</option>
          <option value="sent">Sent emails</option>
        </select>
        <input type="search" id="pnQ" class="pn-in" style="flex:1;min-width:180px"
               placeholder="Search reference, name or email" autocomplete="off">
        <select id="pnStatus" class="pn-in" style="width:auto">
          <option value="all">All statuses</option>
          <option value="paid">Paid</option>
          <option value="pending">Pending</option>
          <option value="failed">Failed</option>
          <option value="expired">Expired</option>
        </select>
        <button class="pn-b gh" id="pnRefresh">Refresh</button>
        <button class="pn-b" id="pnRecon">Reconcile with Stripe</button>
        <button class="pn-b gh" id="pnNew">+ New</button>
        <button class="pn-b" id="pnNewListing" style="display:none">+ Listing</button>
        <button class="pn-b gh" id="pnImport" style="display:none">Import</button>
        <button class="pn-b" id="pnBulk" style="display:none">Bulk email</button>
        <button class="pn-b gh" id="pnPaste" style="display:none">Paste a post</button>
      </div>

      <div class="pn-filters" id="pnFilters">
        <select id="pnSort" class="pn-in">
          <option value="recent">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="name">Name A&ndash;Z</option>
          <option value="nameDesc">Name Z&ndash;A</option>
          <option value="budget">Budget, high to low</option>
          <option value="budgetAsc">Budget, low to high</option>
        </select>
        <select id="pnClosed" class="pn-in">
          <option value="all">Open and placed</option>
          <option value="open">Open only</option>
          <option value="closed">Placed only</option>
        </select>
        <select id="pnDocs" class="pn-in">
          <option value="all">Any documents</option>
          <option value="yes">Has documents</option>
          <option value="no">No documents</option>
        </select>
        <input id="pnBMin" class="pn-in num" type="number" placeholder="&euro; min" min="0">
        <input id="pnBMax" class="pn-in num" type="number" placeholder="&euro; max" min="0">
        <button class="pn-b gh" id="pnClear" style="padding:7px 13px;font-size:13.4px">Clear</button>
      </div>

      <div class="pn-main">
        <div class="pn-list" id="pnList"><div class="pn-empty">Loading&hellip;</div></div>
        <div class="pn-pane" id="pnPane">
          <div class="pn-empty"><div>Select an entry to see everything we hold,<br>
            and to work on it.</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="pn-modal" id="pnModal"><div class="bx" id="pnModalBox"></div></div>

</main>

<script>
/* FastKeys staff panel.
   The session is an HttpOnly cookie, so nothing here can read it. Every
   permission is checked again on the server: what follows only decides what to
   draw, and a hidden button is a courtesy rather than a control. */
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var yr = $('#yr'); if(yr) yr.textContent = new Date().getFullYear();
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g,
    function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

  var me = null, selected = null, selectedKind = 'list', cachedRows = [];
  var view = 'clients';   /* clients | mail */

  function when(s){
    if(!s) return '\u2014';
    var d = new Date(s);
    return isNaN(d) ? s : d.toLocaleString('en-GB',
      {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }
  function euro(n){ return n == null || n === '' ? '' : '\u20ac' + Number(n).toLocaleString('nl-NL'); }
  function isOwner(){ return me && me.role === 'owner'; }

  /* Mirrors EDITABLE on the server. Anything Stripe owns is deliberately absent:
     amounts and session ids record what happened with money, and typing over
     them would put this database at odds with the payment processor. */
  var FIELDS = [
    {k:'name', label:'Full name'},
    {k:'email', label:'Email', type:'email'},
    {k:'phone', label:'Phone'},
    {k:'city', label:'City'},
    {k:'employment', label:'Situation', type:'select',
     options:['','permanent','fixed','self','student','intern']},
    {k:'role', label:'Job title or study'},
    {k:'organisation', label:'Employer or university'},
    {k:'income', label:'Monthly income'},
    {k:'budget', label:'Monthly budget'},
    {k:'savings', label:'Savings'},
    {k:'guarantor_income', label:'Guarantor income'},
    {k:'months_in_advance', label:'Rent in advance', type:'select', options:['0','1','2','3','6']},
    {k:'household', label:'Household', type:'select', options:['single','partner']},
    {k:'date_of_birth', label:'Date of birth', type:'date'},
    {k:'available_from', label:'Available from', type:'date'},
    {k:'duration', label:'Duration', type:'select',
     options:['6 to 12 months','12+ months','24+ months','an indefinite period']},
    {k:'hobbies', label:'Hobbies', type:'textarea', wide:true},
    {k:'notes', label:'Notes', type:'textarea', wide:true}
  ];

  function api(route, params, method){
    var url = '/api/panel/' + route;
    var opts = {method: method || 'GET', headers:{'Accept':'application/json'}, credentials:'same-origin'};
    if(opts.method === 'GET'){
      var qs = new URLSearchParams(params || {}).toString();
      if(qs) url += '?' + qs;
    } else {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(params || {});
    }
    return fetch(url, opts).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(b){
        if(r.status === 401){ sessionLapsed(); throw new Error('Signed out'); }
        if(!r.ok) throw new Error(b.error || 'Request failed');
        return b;
      });
    });
  }

  /* A lapsed session used to hide the whole panel, so a half-written email, an
     import draft or a form vanished the moment any background request came back
     401. Now nothing is torn down: a bar appears, the work stays on screen, and
     signing in again carries on where it left off. */
  var lapsed = false;
  function sessionLapsed(){
    if(lapsed) return;
    lapsed = true;
    var bar = document.createElement('div');
    bar.id = 'pnLapsed';
    bar.innerHTML =
      '<div><b>Your session expired.</b> Nothing you have typed is lost. Sign in again to carry on.</div>' +
      '<form id="pnReauth" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
      '<input id="pnReEmail" class="pn-in" type="email" placeholder="Email" autocomplete="username" style="width:auto">' +
      '<input id="pnRePass" class="pn-in" type="password" placeholder="Password" autocomplete="current-password" style="width:auto">' +
      '<button class="pn-b" type="submit">Sign in</button></form>' +
      '<span id="pnReMsg" style="font-size:13px"></span>';
    document.body.appendChild(bar);
    if(me && me.email) document.querySelector('#pnReEmail').value = me.email;
    var pw = document.querySelector('#pnRePass');
    if(pw) pw.focus();
    document.querySelector('#pnReauth').addEventListener('submit', function(e){
      e.preventDefault();
      var msg = document.querySelector('#pnReMsg');
      msg.textContent = 'Signing in\u2026'; msg.style.color = 'rgba(237,239,242,.6)';
      fetch('/api/admin/login', {
        method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
        body: JSON.stringify({email: document.querySelector('#pnReEmail').value.trim(),
                              password: document.querySelector('#pnRePass').value})
      }).then(function(r){ return r.json().catch(function(){ return {}; })
          .then(function(b){ return {ok:r.ok, b:b}; }); })
        .then(function(res){
          if(res.ok && res.b.user){
            lapsed = false; me = res.b.user; bar.remove(); load(); return;
          }
          msg.textContent = 'That did not work.'; msg.style.color = '#F0A9A9';
        })
        .catch(function(){ msg.textContent = 'Could not reach the server.'; msg.style.color = '#F0A9A9'; });
    });
  }

  function showLogin(){
    me = null;
    lapsed = false;
    var oldBar = document.querySelector('#pnLapsed');
    if(oldBar) oldBar.remove();
    document.body.classList.remove('pn-active');
    $('#panelView').hidden = true;
    $('#loginView').hidden = false;
  }
  /* Loaded once so the noticeboard's share-with-a-client picker is populated
     without a request every time a form opens. */
  function cacheClients(){
    api('list', {sort: 'name'})
      .then(function(d){
        window.__clients = d.rows.map(function(r){ return {reference: r.reference, name: r.name}; });
      })
      .catch(function(){ window.__clients = []; });
  }

  function showPanel(user){
    me = user;
    cacheClients();
    document.body.classList.add('pn-active');
    $('#loginView').hidden = true;
    $('#panelView').hidden = false;
    $('#pnWho').textContent = user.name || user.email;
    $('#pnRole').textContent = user.role;
    $('#pnRole').className = 'pn-role' + (user.role === 'staff' ? ' staff' : '');
    /* Owner-only controls are removed rather than left to fail with a 403. */
    if(!isOwner()){ $('#pnNew').style.display = 'none'; $('#pnRecon').style.display = 'none'; }
    load();
  }

  $('#loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var btn = $('#pnGo'), msg = $('#pnMsg');
    msg.className = 'pn-msg';
    btn.disabled = true; btn.textContent = 'Signing in\u2026';
    fetch('/api/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
      body: JSON.stringify({email: $('#pnEmail').value.trim(), password: $('#pnPass').value})
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(b){ return {ok:r.ok,b:b,status:r.status}; });
    }).then(function(r){
      btn.disabled = false; btn.textContent = 'Sign in';
      if(r.ok && r.b.user){ $('#pnPass').value = ''; showPanel(r.b.user); return; }
      msg.className = 'pn-msg show err';
      var reasons = {
        too_many_attempts: 'Too many attempts. Wait fifteen minutes and try again.',
        setup_incomplete: 'The accounts table is missing. Run npm run db:migrate.',
        password_needs_reset: 'This account predates a fix. Re-run npm run admin:user for this email.',
        service_unavailable: 'The panel cannot reach its database. This is not your password.',
        not_configured: 'The panel is not configured on this deployment.',
        bad_origin: 'Your browser blocked the request. Reload and try again.',
        missing_fields: 'Please fill in both fields.'
      };
      msg.textContent = reasons[r.b.error]
        || (r.status === 404 ? 'The login endpoint is not deployed yet.'
                             : 'That email and password do not match an account.');
    }).catch(function(){
      btn.disabled = false; btn.textContent = 'Sign in';
      msg.className = 'pn-msg show err';
      msg.textContent = 'Could not reach the server. Try again in a moment.';
    });
  });

  $('#pnOut').addEventListener('click', function(){
    fetch('/api/admin/logout', {method:'POST', credentials:'same-origin'})
      .then(showLogin).catch(showLogin);
  });

  /* ------------------------------------------------------------------ list */
  function load(){
    if(view === 'mail') return loadMail();
    if(view === 'listings') return loadListings();
    /* The Archived tab is the client list with one filter fixed: only the
       applications that were deliberately taken off the books. Everywhere else
       shows active clients only, so nothing archived can be acted on by
       accident. */
    selectedKind = view === 'archived' ? 'list' : $('#pnKind').value;
    $('#pnList').innerHTML = '<div class="pn-empty">Loading\u2026</div>';
    api(selectedKind, {
      q: $('#pnQ').value.trim(), status: $('#pnStatus').value,
      sort: $('#pnSort').value, closed: $('#pnClosed').value, docs: $('#pnDocs').value,
      budgetMin: $('#pnBMin').value, budgetMax: $('#pnBMax').value,
      archived: view === 'archived' ? 'only' : 'active'
    })
      .then(function(d){
        cachedRows = d.rows;
        var counts = d.counts || [];
        var total = counts.reduce(function(s,c){ return s + c.n; }, 0);
        var paid = (counts.filter(function(c){ return c.status === 'paid'; })[0] || {n:0}).n;
        var unemailed = selectedKind === 'list'
          ? d.rows.filter(function(r){ return r.status === 'paid' && !r.applicant_emailed_at; }).length : 0;
        $('#pnStats').innerHTML =
          '<span><b>' + total + '</b> total</span><span><b>' + paid + '</b> paid</span>' +
          (unemailed ? '<span class="warn"><b>' + unemailed + '</b> never emailed</span>' : '');

        if(!d.rows.length){ $('#pnList').innerHTML = '<div class="pn-empty">Nothing matches.</div>'; return; }
        $('#pnList').innerHTML = d.rows.map(function(r){
          var flags = [];
          if(selectedKind === 'list'){
            if(r.status === 'paid' && !r.applicant_emailed_at) flags.push('no confirmation email sent');
            if(r.status === 'paid' && !r.notified_at) flags.push('you were never notified');
          } else {
            if(r.status === 'paid' && !r.scheduled_for) flags.push('no slot agreed yet');
            if(r.status === 'paid' && r.service === 'express' && !r.attended_at) flags.push('EXPRESS \u2014 24h clock running');
          }
          var pill = selectedKind === 'viewings' ? r.service : r.status;
          var bits = [];
          if(selectedKind !== 'viewings'){
            bits.push(esc(r.email));
            if(r.budget) bits.push('\u20ac' + esc(r.budget));
            if(r.doc_count) bits.push(r.doc_count + ' doc' + (r.doc_count > 1 ? 's' : ''));
          } else {
            bits.push(esc(r.property_address || ''));
          }
          var meta = bits.join(' \u00b7 ');
          return '<div class="pn-r' + (r.case_closed_at ? ' closed' : '') +
            (r.archived_at ? ' archived' : '') + '" data-ref="' + esc(r.reference) + '">' +
            '<span class="nm">' + esc(r.name) + '</span>' +
            '<span class="pn-pill ' + esc(pill) + '">' + esc(pill) + '</span>' +
            '<span class="rf">' + esc(r.reference) + '</span>' +
            '<span class="mt">' + meta + ' \u00b7 ' + when(r.paid_at || r.created_at) + '</span>' +
            (flags.length ? '<span class="fl">\u26a0 ' + esc(flags.join(' \u00b7 ')) + '</span>' : '') +
            '</div>';
        }).join('');
        Array.prototype.forEach.call(document.querySelectorAll('.pn-r'), function(el){
          el.addEventListener('click', function(){ openRow(el.dataset.ref); });
        });
        if(selected){
          var cur = document.querySelector('.pn-r[data-ref="' + (window.CSS && CSS.escape ? CSS.escape(selected) : selected) + '"]');
          if(cur) cur.classList.add('sel');
        }
      })
      .catch(function(e){ $('#pnList').innerHTML = '<div class="pn-empty">' + esc(e.message) + '</div>'; });
  }

  function row(k, v){
    return v === null || v === undefined || v === ''
      ? '' : '<tr><td>' + esc(k) + '</td><td>' + esc(v) + '</td></tr>';
  }
  function note(id, msg, ok){
    var n = $(id); if(!n) return;
    n.textContent = msg; n.className = 'pn-msg2 show ' + (ok ? 'ok' : 'err');
  }

  function openRow(ref){
    selected = ref;
    Array.prototype.forEach.call(document.querySelectorAll('.pn-r'), function(el){
      el.classList.toggle('sel', el.dataset.ref === ref);
    });
    $('#pnPane').classList.add('open');
    if(selectedKind === 'viewings') return openViewing(ref);
    $('#pnPane').innerHTML = '<div class="pn-empty">Loading\u2026</div>';
    api('detail', {reference: ref}).then(function(d){ renderApplication(d.row, d.application); })
      .catch(function(e){ $('#pnPane').innerHTML = '<div class="pn-empty">' + esc(e.message) + '</div>'; });
  }

  function renderApplication(r, a){
    var editable = isOwner();
    $('#pnPane').innerHTML =
      '<h2 class="pn-h2">' + esc(r.name) + '</h2>' +
      '<div class="pn-refbig"><code id="pnRefV">' + esc(r.reference) + '</code>' +
      '<button class="pn-cp" id="pnCopy">Copy</button>' +
      '<span class="pn-pill ' + esc(r.status) + '">' + esc(r.status) + '</span></div>' +

      '<div class="pn-sec"><h3>Applicant</h3><table class="pn-t">' +
      row('Email', a.email || r.email) + row('Phone', a.phone) + row('Looking in', a.city) +

    $('#pnCopy').onclick = function(){
      var c = $('#pnCopy');
      (navigator.clipboard && window.isSecureContext
        ? navigator.clipboard.writeText(r.reference) : Promise.reject()
      ).then(function(){ c.textContent='Copied'; c.classList.add('done'); })
       .catch(function(){ c.textContent='Select it manually'; });
      setTimeout(function(){ c.textContent='Copy'; c.classList.remove('done'); }, 2200);
    };

    loadDocs(r.reference);

    /* Two copies because they serve different moments: the letter alone goes
       into a landlord's contact form, and the letter plus the details goes into
       an email where you want the numbers to hand as well. */
    function copyBlock(text, btn){
      (navigator.clipboard && window.isSecureContext
        ? navigator.clipboard.writeText(text) : Promise.reject()
      ).then(function(){
        var was = btn.textContent;
        btn.textContent = 'Copied'; btn.classList.add('done');
        setTimeout(function(){ btn.textContent = was; btn.classList.remove('done'); }, 2200);
      }).catch(function(){
        note('#pnCopyMsg', 'Your browser blocked the clipboard. Select the text and copy it by hand.', false);
      });
    }

    if($('#pnCopyLetter')) $('#pnCopyLetter').onclick = function(){
      copyBlock(r.letter || '', this);
    };

    if($('#pnCopyAll')) $('#pnCopyAll').onclick = function(){
      var money = function(n){ return n ? '\u20ac' + Number(n).toLocaleString('nl-NL') : null; };
      var lines = [
        r.letter || '',
        '',
        '--- applicant details ---',
        'Reference:        ' + r.reference,
        'Name:             ' + (a.name || r.name || ''),
        'Email:            ' + (a.email || r.email || ''),
        a.phone ?            'Phone:            ' + a.phone : null,
        a.city ?             'Looking in:       ' + a.city : null,
        a.employment ?       'Situation:        ' + [a.employment, a.role, a.organisation].filter(Boolean).join(' \u00b7 ') : null,
        a.income ?           'Monthly income:   ' + money(a.income) : null,
        a.budget ?           'Monthly budget:   ' + money(a.budget) : null,
        a.savings ?          'Savings:          ' + money(a.savings) : null,
        a.guarantor_income ? 'Guarantor income: ' + money(a.guarantor_income) : null,
        (a.months_in_advance && a.months_in_advance !== '0')
                           ? 'Rent in advance:  ' + a.months_in_advance + ' month(s)' : null,
        a.household ?        'Household:        ' + (a.household === 'partner' ? 'With partner' : 'Single') : null,
        a.available_from ?   'Available from:   ' + a.available_from : null,
        a.duration ?         'Duration:         ' + a.duration : null,
        a.personality ?      'Traits:           ' + (Array.isArray(a.personality) ? a.personality.join(', ') : a.personality) : null,
        a.hobbies ?          'Hobbies:          ' + a.hobbies : null,
        a.notes ?            'Notes:            ' + a.notes : null
      ].filter(function(l){ return l !== null; });
      copyBlock(lines.join('\n'), this);
    };

    $('#pnCase').onclick = function(){
      var closing = !r.case_closed_at;
      api('caseToggle', {reference: r.reference, closed: closing,
                         note: closing && $('#pnCaseNote') ? $('#pnCaseNote').value.trim() : ''}, 'POST')
        .then(function(){
          note('#pnCaseMsg', closing ? 'Marked as placed.' : 'Reopened.', true);
          load();
          openRow(r.reference);
        })
        .catch(function(e){ note('#pnCaseMsg', e.message, false); });
    };

    if(editable){
      $('#pnSaveF').onclick = function(){
        var fields = {};
        FIELDS.forEach(function(f){ var el = $('#pe_' + f.k); if(el) fields[f.k] = el.value.trim(); });
        var btn = $('#pnSaveF'); btn.disabled = true; btn.textContent = 'Saving\u2026';
        api('update', {reference: r.reference, fields: fields, status: $('#pe_status').value}, 'POST')
          .then(function(res){
            note('#pnEditMsg', res.changed.length ? 'Saved: ' + res.changed.join(', ') : 'Nothing had changed.', true);
            load();
          })
          .catch(function(e){ note('#pnEditMsg', e.message, false); })
          .then(function(){ btn.disabled = false; btn.textContent = 'Save changes'; });
      };

      if($('#pnArchBtn')) $('#pnArchBtn').onclick = function(){
        api('archive', {reference: r.reference,
                        reason: ($('#pnArchReason') || {value:''}).value.trim()}, 'POST')
          .then(function(){ load(); openRow(r.reference); })
          .catch(function(e){ note('#pnEditMsg', e.message, false); });
      };

      if($('#pnUnarch')) $('#pnUnarch').onclick = function(){
        api('unarchive', {reference: r.reference}, 'POST')
          .then(function(){ load(); openRow(r.reference); })
          .catch(function(e){ note('#pnEditMsg', e.message, false); });
      };

      if($('#pnArchBtn')) $('#pnArchBtn').onclick = function(){
        api('archive', {reference: r.reference, reason: $('#pnArchWhy').value.trim()}, 'POST')
          .then(function(){
            /* The row leaves this list, so the pane closes rather than showing
               a stale record. It is one click away in the Archived tab. */
            selected = null;
            $('#pnPane').innerHTML = '<div class="pn-empty"><div>Archived. ' +
              'Find them again in the <b>Archived</b> tab.</div></div>';
            load();
          })
          .catch(function(e){ note('#pnArchMsg', e.message, false); });
      };

      if($('#pnUnarch')) $('#pnUnarch').onclick = function(){
        api('unarchive', {reference: r.reference}, 'POST')
          .then(function(){
            selected = null;
            $('#pnPane').innerHTML = '<div class="pn-empty"><div>Restored. ' +
              'They are back in the <b>Clients</b> tab.</div></div>';
            load();
          })
          .catch(function(e){ note('#pnArchMsg', e.message, false); });
      };

      /* Two deliberate steps: a written reason, and the reference typed out. The
         reason is not bureaucracy, it is the only surviving record of why somebody's
         file was destroyed. */
      if($('#pnDelBtn')) $('#pnDelBtn').onclick = function(){
        var typed = $('#pnDel').value.trim();
        var why = $('#pnDelWhy').value.trim();
        if(!why) return note('#pnDelMsg', 'A reason is required. It is the record of why this was destroyed.', false);
        if(typed !== r.reference) return note('#pnDelMsg', 'Type the reference exactly to confirm.', false);
        if(!confirm('Delete ' + r.reference + ' permanently?\n\nDocuments and email history go with it. This cannot be undone.')) return;
        api('remove', {reference: r.reference, confirm: typed, reason: why}, 'POST')
          .then(function(res){
            selected = null;
            $('#pnPane').innerHTML = '<div class="pn-empty">Deleted. ' + (res.rows || 0) + ' record removed.</div>';
            load();
          })
          .catch(function(e){ note('#pnDelMsg', e.message, false); });
      };
    }
  }

  /* ------------------------------------------------------------------ mail
     A different question from the client view: not who they are, but what has
     been sent to them and when. So the rows are ticks and timestamps, and the
     pane is a send history plus the buttons that add to it. */
  /* A branded email to anybody, with any of the files we already hold attached.
     The recipient defaults to the selected client but can be typed, because the
     common case is forwarding somebody's paperwork to a landlord. */
  function customComposer(ref, client, after){
    $('#pnModalBox').innerHTML =
      '<h3 style="font-size:17px;margin-bottom:6px">Custom email</h3>' +
      '<p class="pn-hint2" style="margin-top:0">Branded, and logged like every other send. ' +
      'Attach anything already uploaded for this client.</p>' +
      '<div class="pn-grid">' +
      '<div class="wide"><label for="cu_to">To</label>' +
        '<div class="pn-inline" style="margin-top:0">' +
        '<select id="cu_pick" class="pn-in" style="flex:0 0 auto;width:auto">' +
          '<option value="' + esc(client.email) + '">' + esc(client.name) + ' (' + esc(client.email) + ')</option>' +
          '<option value="">Someone else\u2026</option></select>' +
        '<input id="cu_to" class="pn-in" value="' + esc(client.email) + '"></div></div>' +
      '<div class="wide"><label for="cu_heading">Heading</label>' +
        '<input id="cu_heading" class="pn-in" placeholder="Your documents for Brusselsestraat 12"></div>' +
      '<div class="wide"><label for="cu_body">Message</label>' +
        '<textarea id="cu_body" class="pn-in" style="min-height:150px" placeholder="Blank lines start a new paragraph."></textarea></div>' +
      '<div><label for="cu_ctal">Button label (optional)</label><input id="cu_ctal" class="pn-in" placeholder="View the listing"></div>' +
      '<div><label for="cu_ctau">Button link (optional)</label><input id="cu_ctau" class="pn-in" placeholder="https://..."></div>' +
      '<div class="wide"><label>Attach</label><div id="cu_files" class="pn-hint2">Loading files\u2026</div></div>' +
      '</div>' +
      '<div class="pn-acts"><button class="pn-b" id="cuSend">Send it</button>' +
      '<button class="pn-b gh" id="cuCancel">Cancel</button></div>' +
      '<div class="pn-msg2" id="cuMsg"></div>';
    $('#pnModal').classList.add('open');
    $('#cuCancel').onclick = function(){ $('#pnModal').classList.remove('open'); };
    $('#cu_pick').onchange = function(){
      $('#cu_to').value = this.value;
      if(!this.value) $('#cu_to').focus();
    };

    fetch('/api/panel/document?reference=' + encodeURIComponent(ref), {credentials:'same-origin'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        var box = $('#cu_files');
        if(!d.files || !d.files.length){ box.textContent = 'Nothing uploaded for this client yet.'; return; }
        box.innerHTML = d.files.map(function(f){
          var kb = f.size_bytes < 1048576 ? Math.round(f.size_bytes/1024) + ' KB'
                                          : (f.size_bytes/1048576).toFixed(1) + ' MB';
          return '<label style="display:flex;gap:9px;align-items:center;padding:5px 0;cursor:pointer">' +
            '<input type="checkbox" class="cu_att" value="' + esc(f.id) + '" style="width:auto">' +
            '<span style="color:var(--chalk);font-size:13.6px">' + esc(f.filename) + '</span>' +
            '<span style="color:rgba(237,239,242,.4);font-size:12.3px">' + kb + '</span></label>';
        }).join('');
      })
      .catch(function(){ $('#cu_files').textContent = 'Could not load the files.'; });

    $('#cuSend').onclick = function(){
      var btn = $('#cuSend');
      btn.disabled = true; btn.textContent = 'Sending\u2026';
      var ids = Array.prototype.map.call(document.querySelectorAll('.cu_att:checked'), function(c){ return c.value; });
      api('sendCustom', {
        reference: ref, to: $('#cu_to').value.trim(),
        heading: $('#cu_heading').value.trim(), body: $('#cu_body').value,
        ctaLabel: $('#cu_ctal').value.trim(), ctaUrl: $('#cu_ctau').value.trim(),
        attachmentIds: ids
      }, 'POST').then(function(res){
        $('#pnModal').classList.remove('open');
        note('#mMsg', 'Sent to ' + res.sentTo + (res.attached ? ' with ' + res.attached + ' attachment(s).' : '.'), true);
        if(after) after();
      }).catch(function(e){
        btn.disabled = false; btn.textContent = 'Send it';
        note('#cuMsg', e.message, false);
      });
    };
  }

    var first = String(client.name || '').split(' ')[0];
    $('#pnModalBox').innerHTML =

      'details &mdash; those come at the meeting.</p>' +
      '<div class="pn-grid">' +
      '<div><label for="lo_to">Landlord or agency email</label>' +
        '<input id="lo_to" class="pn-in" type="email" placeholder="info@vastgoed.nl"></div>' +
      '<div><label for="lo_name">Their name (optional)</label>' +
        '<input id="lo_name" class="pn-in" placeholder="Van der Berg Vastgoed"></div>' +
      '<div class="wide"><label for="lo_address">Which property</label>' +
        '<input id="lo_address" class="pn-in" placeholder="Brusselsestraat 12, Maastricht"></div>' +
      '<div class="wide"><label for="lo_listing">Link to their listing (optional)</label>' +
        '<input id="lo_listing" class="pn-in" placeholder="https://www.pararius.nl/..."></div>' +
      '<div><label for="lo_sender">Signed by</label>' +
        '<input id="lo_sender" class="pn-in" value="Theo, FastKeys"></div>' +
      '<div></div>' +
