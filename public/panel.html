  /* Shrinks an image in the browser before it is uploaded.
     A phone photo is routinely 12 megapixels and 5 to 15 MB, while a listing
     photo only ever displays at around 1200px wide. Downscaling here means the
     size limit stops being something anyone has to think about, a batch of
     twenty uploads in seconds rather than minutes, and R2 stores a fraction as
     much. Falls back to the original file if anything goes wrong, so a browser
     that cannot do this still uploads something. */
  function shrinkImage(file){
    /* Tried in order until one fits. A real photo clears the first attempt; the
       later steps exist for the occasional enormous one rather than as the
       normal path. */
    var STEPS = [[2000, 0.85], [1800, 0.75], [1400, 0.7], [1100, 0.65]];
    var LIMIT = 7.5 * 1024 * 1024;   // just under the server's 8 MB

    return new Promise(function(resolve){
      if(file.type === 'image/gif') return resolve(file);      // may be animated
      if(file.size <= 1.5 * 1024 * 1024) return resolve(file); // already small

      var url = URL.createObjectURL(file);
      var img = new Image();

      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        if(!w || !h){ URL.revokeObjectURL(url); return resolve(file); }

        var attempt = function(i){
          if(i >= STEPS.length){ URL.revokeObjectURL(url); return resolve(file); }
          var maxEdge = STEPS[i][0], quality = STEPS[i][1];
          var scale = Math.min(1, maxEdge / Math.max(w, h));
          try {
            var canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(w * scale));
            canvas.height = Math.max(1, Math.round(h * scale));
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(function(blob){
              if(!blob) { URL.revokeObjectURL(url); return resolve(file); }
              if(blob.size > LIMIT && i < STEPS.length - 1) return attempt(i + 1);
              URL.revokeObjectURL(url);
              if(blob.size >= file.size) return resolve(file);
              var name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
              try {
                resolve(new File([blob], name, {type: 'image/jpeg'}));
              } catch(e) {
                resolve(blob);
              }
            }, 'image/jpeg', quality);
          } catch(e){
            URL.revokeObjectURL(url);
            resolve(file);
          }
        };
        attempt(0);
      };

      img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  /* Shared by the listing pane and the edit form. */
  function wireUpload(l){
    var btn = document.querySelector('#ls_upload');
    if(!btn || !l || !l.id) return;
    btn.onclick = function(){
      var input = document.querySelector('#ls_file');
      var files = Array.prototype.slice.call((input && input.files) || []);
      if(!files.length) return note('#ls_upmsg', 'Choose one or more images first.', false);
      btn.disabled = true;
      var done = 0, total = files.length, problems = [];

      var finish = function(){
        btn.disabled = false; btn.textContent = 'Upload';
        if(input) input.value = '';
        /* Every failure is named. The previous version counted them silently,
           which is how a dozen uploads could quietly become eight. */
        if(problems.length){
          note('#ls_upmsg', done + ' of ' + total + ' uploaded. Could not upload: ' +
            problems.join('; '), false);
        } else {
          note('#ls_upmsg', 'All ' + done + ' uploaded.', true);
        }
        loadListings();
      };

      var next = function(){
        if(!files.length) return finish();
        var index = total - files.length + 1;
        var file = files.shift();
        btn.textContent = 'Uploading ' + index + '/' + total + '\u2026';

        shrinkImage(file).then(function(ready){
          if(ready.size > 8 * 1024 * 1024){
            problems.push(file.name + ' (' + (ready.size / 1024 / 1024).toFixed(1) +
              ' MB, still too large after resizing)');
            return next();
          }
          return fetch('/api/panel/listing-upload?id=' + encodeURIComponent(l.id), {
            method:'POST', credentials:'same-origin',
            headers:{'Content-Type': ready.type || 'application/octet-stream'}, body: ready
          }).then(function(r){ return r.json().catch(function(){ return {}; })
              .then(function(b){ return {ok:r.ok, b:b, status:r.status}; }); })
            .then(function(res){
              if(res.ok && res.b.src){
                done++;
                var g = document.querySelector('#ls_gallery');
                if(g) g.insertAdjacentHTML('beforeend',
                  '<figure class="pn-photo"><img src="' + esc(res.b.src) + '" alt=""></figure>');
              } else {
                var why = {
                  too_large: 'too large', unsupported_type: 'not an accepted image type',
                  not_permitted: 'only the owner may upload', bad_id: 'listing not found',
                  not_configured: 'storage is not configured on this deployment'
                }[res.b.error] || (res.b.error || ('HTTP ' + res.status));
                problems.push(file.name + ' (' + why + ')');
              }
              next();
            });
        }).catch(function(err){
          problems.push(file.name + ' (' + (err && err.message ? err.message : 'upload failed') + ')');
          next();
        });
      };
      next();
    };
  }

      'it here. Nothing is fetched from Facebook, so no login is involved &mdash; you are pasting ' +
      'text you are already looking at. Photos have to be saved from the post and uploaded ' +
      'afterwards, because Facebook image links expire.</p>' +
      '<textarea id="imp_text" class="pn-in" style="min-height:170px" ' +

  /* What the parser made of it, as an editable form. Anything it could not
     work out is simply blank rather than filled with a guess. */
  function showDraft(res){

    var found = ['title','address','city','rent','deposit','available_from','size','rooms',
                 'furnished','registration','contact_email','contact_phone']

      (res.note ? esc(res.note) : '') + '</p>' +
      listingFields({
        title: d.title, address: d.address, city: d.city || 'Maastricht',
        rent: d.rent, deposit: d.deposit, available_from: d.available_from,
        size: d.size, rooms: d.rooms, furnished: d.furnished,
        registration: d.registration, description: d.description,
        contact_email: d.contact_email, contact_phone: d.contact_phone,
        external_url: d.source_url || '', submitted_by: 'landlord', status: 'draft',
        images: '[]'
      }) +
      ((res.images && res.images.length)
        ? '<p class="pn-hint2">' + res.images.length + ' photo(s) found on the page. They will be ' +
          'copied into your own storage when you save, so they cannot break later.</p>'
        : '') +

      '<div class="pn-msg2" id="impSaveMsg"></div></div>';

    $('#impSave').onclick = function(){
      var btn = $('#impSave');

      var payload = collectListing(null);
      payload.source = res.source || 'other';
      payload.source_url = d.source_url || '';
      api('listingSave', payload, 'POST')
        .then(function(saved){
          var imgs = (res.images || []).slice(0, 30);
          if(!imgs.length){
            $('#pnModal').classList.remove('open');
            loadListings();
            setTimeout(function(){ openListing(saved.id); }, 500);
            return;
          }
          btn.textContent = 'Fetching photos\u2026';
          return api('listingFetchImages', {id: saved.id, urls: imgs}, 'POST')
            .then(function(r){
              $('#pnModal').classList.remove('open');
              loadListings();
              setTimeout(function(){ openListing(saved.id); }, 500);
              note('#pnArchMsg', '', true);
              if(r.problems && r.problems.length){
                alert('Listing created. ' + r.saved + ' of ' + r.attempted + ' photos saved.\n\n' +
                      'Could not fetch: ' + r.problems.join('; '));
              }
            });
        })
        .catch(function(e){
          btn.disabled = false; btn.textContent = 'Create the listing';
          note('#impSaveMsg', e.message, false);
        });
    };
  }

         exists once the email that carried it is buried. */
      '<div class="pn-sec"><h3>Who listed it &mdash; not public</h3><table class="pn-t">' +
      (l.contact_name || l.contact_email || l.contact_phone || l.external_url
        ? row('Name', l.contact_name) +
          (l.contact_email ? '<tr><td>Email</td><td><a href="mailto:' + esc(l.contact_email) +
            '" style="color:var(--key)">' + esc(l.contact_email) + '</a></td></tr>' : '') +
          (l.contact_phone ? '<tr><td>Phone</td><td><a href="tel:' + esc(String(l.contact_phone).replace(/[^+\d]/g,'')) +
            '" style="color:var(--key)">' + esc(l.contact_phone) + '</a></td></tr>' : '') +
          (l.external_url ? '<tr><td>Their listing</td><td><a href="' + esc(l.external_url) +
            '" target="_blank" rel="noopener" style="color:var(--key)">open</a></td></tr>' : '')
        : '<tr><td colspan="2" style="color:rgba(237,239,242,.42)">Nothing recorded. Add it while you still have the email.</td></tr>') +
      '</table></div>' +

      '<div class="pn-sec"><h3>Share with a client</h3>' +
      (l.status === 'published'
        ? '<div class="pn-inline"><select id="lsClient" class="pn-in">' + clientOptions(null) + '</select>' +
          '<button class="pn-b" id="lsShare">Send it</button></div>' +
          '<p class="pn-hint2">Sends the branded property email with the photos and the lister\u2019s ' +
          'own contact details, and logs it against that client.</p>'
        : '<p class="pn-hint2" style="margin-top:0">Publish it first.</p>') +
      '<div class="pn-msg2" id="lsShareMsg"></div></div>' +

      (isOwner()
        ? '<div class="pn-sec"><div class="pn-acts">' +
          '<button class="pn-b gh" id="lsEdit">Edit</button>' +
          '<button class="pn-b rd" id="lsDel">Delete</button></div></div>'
        : '');

    wireUpload(l);

    /* Removal rewrites the array. The object stays in R2, which is the cheaper
       mistake if the wrong one is removed. */
    Array.prototype.forEach.call(document.querySelectorAll('#ls_gallery button.del'), function(btn){
      btn.addEventListener('click', function(){
        if(!confirm('Remove this photo from the listing?')) return;
        var keep = images.filter(function(_, i){ return i !== Number(btn.dataset.i); });
        api('listingSave', {id: l.id, title: l.title, address: l.address, city: l.city,
          rent: l.rent, deposit: l.deposit, available_from: l.available_from, size: l.size,
          rooms: l.rooms, furnished: l.furnished, registration: l.registration,
          submitted_by: l.submitted_by, status: l.status, contact_name: l.contact_name,
          contact_email: l.contact_email, contact_phone: l.contact_phone,
          external_url: l.external_url, description: l.description,
          images: keep, replaceImages: true}, 'POST')
          .then(function(){ loadListings(); setTimeout(function(){ openListing(l.id); }, 400); })
          .catch(function(e){ note('#ls_upmsg', e.message, false); });
      });
    });

    if($('#lsShare')) $('#lsShare').onclick = function(){
      var btn = $('#lsShare');
      btn.disabled = true; btn.textContent = 'Sending\u2026';
      api('shareListing', {id: id, reference: $('#lsClient').value}, 'POST')
        .then(function(res){ note('#lsShareMsg', 'Sent to ' + res.sentTo + '.', true); })
        .catch(function(e){ note('#lsShareMsg', e.message, false); })
        .then(function(){ btn.disabled = false; btn.textContent = 'Send it'; });
    };
    if($('#lsEdit')) $('#lsEdit').onclick = function(){ listingForm(l); };
    if($('#lsDel')) $('#lsDel').onclick = function(){
      if(!confirm('Delete "' + l.title + '" from the board?')) return;
      api('listingDelete', {id: id}, 'POST').then(function(){
        selected = null;
        $('#pnPane').innerHTML = '<div class="pn-empty">Deleted.</div>';
        loadListings();
      });
    };
  }

  /* Sending the same email to many clients at once.
     Who gets it is chosen with the tickboxes in the mail list; with nothing
     ticked it goes to everyone shown, which is the old send-to-all. Always
     previewed first: this is the one action in the panel with no undo, and the
     preview is what turns a bulk send from a leap into a decision. */
  function bulkDialog(){
    var chosen = bulkChosen();
    var toAll = !bulkSel.size;
    $('#pnModalBox').innerHTML =
      '<h3 style="font-size:17px;margin-bottom:6px">Bulk email</h3>' +
      '<p class="pn-hint2" style="margin-top:0">' +
      (toAll
        ? 'No boxes are ticked, so this goes to <b>everyone shown</b> (' + chosen.length + '). ' +
          'Tick clients in the list first to narrow it down.'
        : 'Going to the <b>' + chosen.length + ' ticked</b> client' + (chosen.length === 1 ? '' : 's') + '.') +
      ' One email each, sent separately, so nobody sees anyone else\u2019s address. ' +
      'Archived clients are always skipped.</p>' +
      '<div class="pn-grid">' +
      '<div class="wide"><label for="bk_kind">Which email</label>' +
      '<select id="bk_kind" class="pn-in">' +
      '<option value="documents">Ask for documents &mdash; paid clients</option>' +
      '<option value="receipt">Receipt / confirmation &mdash; paid clients</option>' +
      '<option value="reminder">Payment reminder &mdash; unpaid only, max two each</option>' +
      '</select></div>' +
      '<div class="wide"><label for="bk_note">Extra line (optional, documents only)</label>' +
      '<input id="bk_note" class="pn-in" placeholder="e.g. We are viewing three places next week."></div>' +
      '</div>' +
      '<div class="pn-acts"><button class="pn-b" id="bkCheck">See who would get it</button>' +
      '<button class="pn-b gh" id="bkCancel">Cancel</button></div>' +
      '<div class="pn-msg2" id="bkMsg"></div><div id="bkResult"></div>';
    $('#pnModal').classList.add('open');
    $('#bkCancel').onclick = function(){ $('#pnModal').classList.remove('open'); };

    var gather = function(){
      return {kind: $('#bk_kind').value, note: $('#bk_note').value.trim(),
              references: bulkChosen()};
    };

    $('#bkCheck').onclick = function(){
      var body = gather(); body.dryRun = true;
      api('sendBulk', body, 'POST').then(function(r){
        var skipped = (r.list || []).filter(function(x){ return x.skipped; });
        $('#bkResult').innerHTML =
          '<div class="pn-sec"><h3>' + r.willSend + ' of ' + r.total + ' would receive it</h3>' +
          (skipped.length
            ? '<p class="pn-hint2" style="margin-top:0">Skipped: ' +
              skipped.slice(0,12).map(function(x){ return esc(x.reference) + ' (' + esc(x.skipped) + ')'; }).join(', ') +
              (skipped.length > 12 ? ' and ' + (skipped.length - 12) + ' more' : '') + '</p>'
            : '') +
          (r.willSend
            ? '<div class="pn-acts"><button class="pn-b" id="bkGo">Send to ' + r.willSend + ' now</button></div>'
            : '<p class="pn-hint2">Nobody on this list qualifies.</p>') +
          '<div class="pn-msg2" id="bkGoMsg"></div></div>';
        if($('#bkGo')) $('#bkGo').onclick = function(){
          if(!confirm('Send this to ' + r.willSend + ' clients?\n\nThere is no undo.')) return;
          var btn = $('#bkGo'); btn.disabled = true; btn.textContent = 'Sending\u2026';
          api('sendBulk', gather(), 'POST').then(function(res){
            $('#pnModal').classList.remove('open');
            bulkSel.clear();
            loadMail();
            alert('Sent to ' + res.sent + '.' +
              (res.failed && res.failed.length
                ? '\n\nFailed: ' + res.failed.map(function(f){ return f.reference + ' (' + f.error + ')'; }).join('; ')
                : ''));
          }).catch(function(e){
            btn.disabled = false; btn.textContent = 'Send now';
            note('#bkGoMsg', e.message, false);
          });
        };
      }).catch(function(e){ note('#bkMsg', e.message, false); });
    };
  }

  /* Which clients are ticked for a bulk email. Kept across refreshes of the
     list, so ticking, searching, and ticking more all add up. */
  var bulkSel = new Set();
  function bulkChosen(){
    /* Ticked clients; with nothing ticked, everyone currently shown. */
    var shown = (window.__mailRows || []).map(function(r){ return r.reference; });
    if(!bulkSel.size) return shown;
    return shown.filter(function(ref){ return bulkSel.has(ref); });
  }
  function bulkCount(){
    var n = bulkChosen().length;
    var el = $('#pnSelCount');
    if(el) el.textContent = bulkSel.size
      ? n + ' selected'
      : 'none ticked \u2014 a bulk email would go to all ' + n + ' shown';
    var all = $('#pnSelAll');
    if(all) all.checked = bulkSel.size > 0 && n === (window.__mailRows || []).length;
  }

  function loadMail(){
    if($('#pnMailKind').value === 'sent') return loadSent();
    $('#pnList').innerHTML = '<div class="pn-empty">Loading\u2026</div>';
    api('emails', {q: $('#pnQ').value.trim()})
      .then(function(d){
        window.__mailRows = d.rows;
        /* Ticks for rows that fell out of the list (searched away, archived,
           deleted) are dropped, so a bulk send can never reach somebody who is
           not on screen to be seen. */
        var visible = new Set(d.rows.map(function(r){ return r.reference; }));
        bulkSel.forEach(function(ref){ if(!visible.has(ref)) bulkSel.delete(ref); });

        var pending = d.rows.filter(function(r){ return r.status === 'paid' && !r.applicant_emailed_at; }).length;
        $('#pnStats').innerHTML = '<span><b>' + d.rows.length + '</b> clients</span>' +
          (pending ? '<span class="warn"><b>' + pending + '</b> awaiting a receipt</span>' : '');
        if(!d.rows.length){ $('#pnList').innerHTML = '<div class="pn-empty">Nothing matches.</div>'; return; }

        var canPick = isOwner();
        $('#pnList').innerHTML =
          (canPick
            ? '<div class="pn-selbar"><label><input type="checkbox" id="pnSelAll"> Select all</label>' +
              '<span id="pnSelCount"></span></div>'
            : '') +
          d.rows.map(function(r){
          function tick(on, label, bad){
            return '<span class="pn-tick' + (on ? ' on' : (bad ? ' bad' : '')) + '">' +
              (on ? '\u2713' : '\u25cb') + ' ' + label + '</span>';
          }
          return '<div class="pn-mailrow' + (r.case_closed_at ? ' closed' : '') +
            '" data-ref="' + esc(r.reference) + '">' +
            '<span class="nm">' +
              (canPick
                ? '<input type="checkbox" class="pn-bksel" data-ref="' + esc(r.reference) + '"' +
                  (bulkSel.has(r.reference) ? ' checked' : '') + '>'
                : '') +
              esc(r.name) + '</span>' +
            '<span class="pn-pill ' + esc(r.status) + '">' + esc(r.status) + '</span>' +
            '<span class="mt" style="grid-column:1/-1">' + esc(r.email) + '</span>' +
            '<div class="pn-ticks">' +
              tick(r.applicant_emailed_at, 'receipt') +
              tick(r.reminder_count > 0, 'reminder' + (r.reminder_count > 1 ? ' \u00d7' + r.reminder_count : '')) +
              tick(r.sent_count > 0, (r.sent_count || 0) + ' sent') +
              (r.failed_count ? tick(false, r.failed_count + ' failed', true) : '') +
              (r.last_email_at ? '<span class="pn-tick">last ' + esc(when(r.last_email_at)) + '</span>' : '') +
            '</div></div>';
        }).join('');

        Array.prototype.forEach.call(document.querySelectorAll('.pn-mailrow'), function(el){
          el.addEventListener('click', function(){ openMail(el.dataset.ref, d.rows); });
        });
        /* The tickbox chooses; it must not also open the pane. */
        Array.prototype.forEach.call(document.querySelectorAll('.pn-bksel'), function(cb){
          cb.addEventListener('click', function(e){ e.stopPropagation(); });
          cb.addEventListener('change', function(){
            if(cb.checked) bulkSel.add(cb.dataset.ref); else bulkSel.delete(cb.dataset.ref);
            bulkCount();
          });
        });
        if($('#pnSelAll')) $('#pnSelAll').addEventListener('change', function(){
          var on = this.checked;
          Array.prototype.forEach.call(document.querySelectorAll('.pn-bksel'), function(cb){
            cb.checked = on;
            if(on) bulkSel.add(cb.dataset.ref); else bulkSel.delete(cb.dataset.ref);
          });
          bulkCount();
        });
        bulkCount();
      })
      .catch(function(e){ $('#pnList').innerHTML = '<div class="pn-empty">' + esc(e.message) + '</div>'; });
  }

  /* ------------------------------------------------------------ sent emails
     Every outgoing email, newest first, across all clients. The list is the
     log; clicking one shows the whole thing, body included. */
  var sentRows = [];
  function loadSent(){
    $('#pnList').innerHTML = '<div class="pn-empty">Loading\u2026</div>';
    api('sentEmails', {q: $('#pnQ').value.trim()})
      .then(function(d){
        sentRows = d.rows;
        var failed = d.rows.filter(function(r){ return r.status === 'failed'; }).length;
        $('#pnStats').innerHTML = '<span><b>' + d.rows.length + '</b> sent</span>' +
          (failed ? '<span class="warn"><b>' + failed + '</b> failed</span>' : '');
        if(!d.rows.length){
          $('#pnList').innerHTML = '<div class="pn-empty">Nothing has been sent yet.</div>';
          return;
        }
        $('#pnList').innerHTML = d.rows.map(function(r){
          return '<div class="pn-mailrow" data-id="' + esc(r.id) + '">' +
            '<span class="nm">' + esc(r.subject) + '</span>' +
            '<span class="pn-logkind' + (r.status === 'failed' ? ' failed' : '') + '">' + esc(r.kind) + '</span>' +
            '<span class="mt" style="grid-column:1/-1">to ' + esc(r.recipient) +
              (r.name ? ' \u00b7 ' + esc(r.name) : '') +
              ' \u00b7 ' + esc(when(r.sent_at)) + ' \u00b7 by ' + esc(r.sent_by) + '</span>' +
            '</div>';
        }).join('');
        Array.prototype.forEach.call(document.querySelectorAll('.pn-mailrow'), function(el){
          el.addEventListener('click', function(){ openSent(el.dataset.id); });
        });
      })
      .catch(function(e){ $('#pnList').innerHTML = '<div class="pn-empty">' + esc(e.message) + '</div>'; });
  }

  function openSent(id){
    var r = sentRows.filter(function(x){ return x.id === id; })[0];
    if(!r) return;
    selected = id;
    Array.prototype.forEach.call(document.querySelectorAll('.pn-mailrow'), function(el){
      el.classList.toggle('sel', el.dataset.id === id);
    });
    $('#pnPane').classList.add('open');
    $('#pnPane').innerHTML =
      '<h2 class="pn-h2">' + esc(r.subject) + '</h2>' +
      '<p class="pn-hint2" style="margin-top:6px">' +
        '<span class="pn-logkind' + (r.status === 'failed' ? ' failed' : '') + '">' + esc(r.kind) + '</span> ' +
        ' to <b style="color:var(--chalk)">' + esc(r.recipient) + '</b>' +
        (r.name ? ' (' + esc(r.name) + ')' : '') +
        ' \u00b7 ' + esc(when(r.sent_at)) + ' \u00b7 by ' + esc(r.sent_by) + '</p>' +
      (r.reference && r.reference !== 'ADHOC'
        ? '<p class="pn-hint2" style="margin-top:2px">Reference <code style="color:var(--key)">' + esc(r.reference) + '</code></p>' : '') +
      (r.status === 'failed'
        ? '<p class="pn-msg2 show err" style="margin-top:10px">This send failed' + (r.error ? ': ' + esc(r.error) : '.') + '</p>' : '') +
      '<div class="pn-sec"><h3>What was sent</h3><div id="sentBody">' +
      '<p class="pn-hint2" style="margin:0">Loading\u2026</p></div></div>';

    api('sentEmail', {id: id})
      .then(function(d){
        var box = $('#sentBody');
        if(!box) return;
        box.innerHTML = d.row && d.row.body
          ? '<div class="pn-pre" style="max-height:520px">' + esc(d.row.body) + '</div>'
          : '<p class="pn-hint2" style="margin:0">This email predates body logging, so only the ' +
            'subject and recipient were kept.</p>';
      })
      .catch(function(e){ if($('#sentBody')) $('#sentBody').innerHTML = '<p class="pn-hint2" style="margin:0">' + esc(e.message) + '</p>'; });
  }

  function openMail(ref, rows){
    var r = rows.filter(function(x){ return x.reference === ref; })[0];
    if(!r) return;
    selected = ref;
    Array.prototype.forEach.call(document.querySelectorAll('.pn-mailrow'), function(el){
      el.classList.toggle('sel', el.dataset.ref === ref);
    });
    $('#pnPane').classList.add('open');
    $('#pnPane').innerHTML =
      '<h2 class="pn-h2">' + esc(r.name) + '</h2>' +
      '<div class="pn-refbig"><code>' + esc(r.reference) + '</code>' +
      '<span class="pn-pill ' + esc(r.status) + '">' + esc(r.status) + '</span></div>' +
      '<p class="pn-hint2" style="margin-top:-6px">' + esc(r.email) + '</p>' +

      '<div class="pn-sec"><h3>Send</h3><div class="pn-acts">' +
      '<button class="pn-b" id="mSendReceipt"' + (r.status !== 'paid' ? ' disabled' : '') + '>' +
        (r.applicant_emailed_at ? 'Resend receipt' : 'Send receipt') + '</button>' +
      '<button class="pn-b gh" id="mSendReminder"' + (r.status === 'paid' ? ' disabled' : '') + '>' +
        'Payment reminder</button>' +
      '<button class="pn-b gh" id="mSendDocs">Ask for documents</button>' +
      '<button class="pn-b gh" id="mSendProperty">Send a property</button>' +
      '<button class="pn-b gh" id="mSendCustom">Custom email</button>' +
      (isOwner() ? '<button class="pn-b gh" id="mSendLandlord">Approach a landlord</button>' : '') +
      '</div>' +
      (r.status !== 'paid'
        ? '<p class="pn-hint2">Unpaid, so the receipt is unavailable. The reminder links back to a ' +
          'page that resumes their stored answers.</p>'
        : '<p class="pn-hint2">The receipt carries their reference, the Stripe receipt link and the ' +
          'details we hold.</p>') +
      '<div class="pn-msg2" id="mMsg"></div></div>' +

      '<div class="pn-sec"><h3>Everything sent to them</h3><div id="mLog">' +
      '<p class="pn-hint2" style="margin:0">Loading\u2026</p></div></div>';

    loadLog(ref);

    var refresh = function(){ loadLog(ref); loadMail(); };
    $('#mSendReceipt').onclick = function(){ send('sendConfirmation', {reference: ref}, this, refresh); };
    $('#mSendReminder').onclick = function(){
      send('remind', {reference: ref}, this, refresh, true);
    };
    $('#mSendDocs').onclick = function(){ send('sendDocuments', {reference: ref}, this, refresh); };
    $('#mSendProperty').onclick = function(){ propertyComposer(ref, r, refresh); };
    $('#mSendCustom').onclick = function(){ customComposer(ref, r, refresh); };
    if($('#mSendLandlord')) $('#mSendLandlord').onclick = function(){ landlordComposer(ref, r, refresh); };
  }

  function send(route, params, btn, after, mayRepeat){
    var was = btn.textContent;
    btn.disabled = true; btn.textContent = 'Sending\u2026';
    var go = function(force){
      api(route, Object.assign({}, params, force ? {force: true} : {}), 'POST')
        .then(function(res){
          note('#mMsg', 'Sent to ' + (res.sentTo || 'them') + '.', true);
          btn.textContent = 'Sent';
          if(after) after();
        })
        .catch(function(e){
          btn.disabled = false; btn.textContent = was;
          if(mayRepeat && /Send again\?/.test(e.message)){
            if(confirm(e.message)) { btn.disabled = true; btn.textContent = 'Sending\u2026'; go(true); }
            return;
          }
          note('#mMsg', e.message, false);
        });
    };
    go(false);
  }

  function loadLog(ref){
    api('emailLog', {reference: ref})
      .then(function(d){
        var box = $('#mLog');
        if(!box) return;
        if(!d.rows.length){
          box.innerHTML = '<p class="pn-hint2" style="margin:0">Nothing has been sent yet.</p>';
          return;
        }
        box.innerHTML = d.rows.map(function(e){
          var meta = '';
          try { var m = JSON.parse(e.meta || '{}');
            if(m.address) meta = esc(m.address);
            else if(m.attempt) meta = 'attempt ' + m.attempt;
          } catch(x){}
          return '<div class="pn-logline">' +
            '<span class="pn-logkind' + (e.status === 'failed' ? ' failed' : '') + '">' + esc(e.kind) + '</span>' +
            '<span><b style="color:var(--chalk)">' + esc(e.subject) + '</b>' +
              (meta ? '<br><span style="color:rgba(237,239,242,.42);font-size:12.4px">' + meta + '</span>' : '') +
              (e.error ? '<br><span style="color:#F0A9A9;font-size:12.4px">' + esc(e.error) + '</span>' : '') +
              '<br><span style="color:rgba(237,239,242,.38);font-size:12.2px">to ' + esc(e.recipient) +
              ' by ' + esc(e.sent_by) + '</span></span>' +
            '<span style="color:rgba(237,239,242,.42);font-size:12.4px;white-space:nowrap">' +
              esc(when(e.sent_at)) + '</span></div>';
        }).join('');
      })
      .catch(function(){ if($('#mLog')) $('#mLog').innerHTML = '<p class="pn-hint2">Could not load the history.</p>'; });
  }

  /* The property composer. Image URLs rather than uploads: a listing photo is
     already hosted, and attachments are the fastest way into a spam folder. */
  function propertyComposer(ref, client, after){

      '<h3 style="font-size:17px;margin-bottom:6px">Send a property to ' + esc(client.name) + '</h3>' +

      '<div class="pn-grid">' +
      '<div class="wide"><label for="pr_headline">Headline</label>' +
        '<input id="pr_headline" class="pn-in" placeholder="A studio on Brusselsestraat, available 1 September"></div>' +

        '<textarea id="pr_intro" class="pn-in" placeholder="We saw this one this morning and thought of your budget and your dates."></textarea></div>' +
      '<div class="wide"><label for="pr_images">Image links, one per line</label>' +

      '<div><label for="pr_address">Address</label><input id="pr_address" class="pn-in"></div>' +
      '<div><label for="pr_rent">Rent</label><input id="pr_rent" class="pn-in" placeholder="\u20ac950 incl."></div>' +
      '<div><label for="pr_deposit">Deposit</label><input id="pr_deposit" class="pn-in" placeholder="\u20ac950"></div>' +
      '<div><label for="pr_available">Available from</label><input id="pr_available" class="pn-in" placeholder="1 September"></div>' +
      '<div><label for="pr_size">Size</label><input id="pr_size" class="pn-in" placeholder="32 m\u00b2"></div>' +
      '<div><label for="pr_rooms">Rooms</label><input id="pr_rooms" class="pn-in" placeholder="Studio"></div>' +
      '<div><label for="pr_furnished">Furnished</label><input id="pr_furnished" class="pn-in" placeholder="Furnished"></div>' +
      '<div><label for="pr_reg">Registration possible</label><input id="pr_reg" class="pn-in" placeholder="Yes"></div>' +
      '<div class="wide"><label for="pr_body">What we think</label>' +

      '</div>' +
      '<div class="pn-acts"><button class="pn-b" id="prSend">Send it</button>' +
      '<button class="pn-b gh" id="prCancel">Cancel</button></div>' +
      '<div class="pn-msg2" id="prMsg"></div>';
    $('#pnModal').classList.add('open');
    $('#prCancel').onclick = function(){ $('#pnModal').classList.remove('open'); };
    $('#prSend').onclick = function(){
      var btn = $('#prSend');
      btn.disabled = true; btn.textContent = 'Sending\u2026';
      api('sendProperty', {
        reference: ref,
        headline: $('#pr_headline').value.trim(), intro: $('#pr_intro').value.trim(),
        images: $('#pr_images').value.split(/\s+/).filter(Boolean),
        listing_url: $('#pr_listing').value.trim(),
        address: $('#pr_address').value.trim(), rent: $('#pr_rent').value.trim(),
        deposit: $('#pr_deposit').value.trim(), available: $('#pr_available').value.trim(),
        size: $('#pr_size').value.trim(), rooms: $('#pr_rooms').value.trim(),
        furnished: $('#pr_furnished').value.trim(), registration: $('#pr_reg').value.trim(),
        body: $('#pr_body').value.trim()
      }, 'POST').then(function(res){
        $('#pnModal').classList.remove('open');
        note('#mMsg', 'Property sent to ' + res.sentTo + '.', true);
        if(after) after();
      }).catch(function(e){
        btn.disabled = false; btn.textContent = 'Send it';
        note('#prMsg', e.message, false);
      });
    };
  }

  /* Open to staff. The server enforces the two-reminder ceiling and refuses
     outright on a paid record, so this only decides what to draw and when to
     ask for confirmation. */
  function wireRemind(ref){
    var btn = $('#pnRemind');
    if(!btn) return;
    btn.onclick = function(){
      var was = btn.textContent;
      var send = function(force){
        btn.disabled = true; btn.textContent = 'Sending\u2026';
        api('remind', {reference: ref, force: !!force}, 'POST')
          .then(function(r){
            note('#pnRemindMsg', 'Reminder ' + r.attempt + ' sent to ' + r.sentTo + '.', true);
            load();
            btn.disabled = true; btn.textContent = 'Reminder sent';
          })
          .catch(function(e){
            btn.disabled = false; btn.textContent = was;
            /* The server asks rather than silently repeating, because a second
               nudge should be somebody's decision and not a stray double click. */
            if(/Send again\?/.test(e.message)){
              if(confirm(e.message)) send(true);
              return;
            }
            note('#pnRemindMsg', e.message, false);
          });
      };
      send(false);
    };
  }

  /* --------------------------------------------------------------- documents
     Available to staff as well: a landlord asks for an enrolment certificate and
     somebody has to send it. Deleting stays with the owner. */
  function loadDocs(ref){
    var list = $('#pnDocList');
    if(!list) return;
    fetch('/api/panel/document?reference=' + encodeURIComponent(ref), {credentials:'same-origin'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d.files || !d.files.length){
          list.innerHTML = '<p class="pn-hint2" style="margin:0">Nothing uploaded yet.</p>';
          return;
        }
        /* Photos are shown as thumbnails and paperwork as a list. A face is
           useless as a filename and a payslip is useless as a thumbnail. */
        var photos = d.files.filter(function(f){ return f.kind === 'photo' || /^image\//.test(f.content_type || ''); });
        var papers = d.files.filter(function(f){ return photos.indexOf(f) === -1; });

        var photoHtml = photos.length
          ? '<div class="pn-photos">' + photos.map(function(f){
              return '<figure class="pn-photo">' +
                '<a href="/api/panel/document?id=' + esc(f.id) + '&inline=1" target="_blank" rel="noopener">' +
                '<img src="/api/panel/document?id=' + esc(f.id) + '&inline=1" alt="' + esc(f.filename) + '" loading="lazy">' +
                '</a><figcaption>' + esc(f.filename) +
                (isOwner() ? ' <button class="del" data-id="' + esc(f.id) + '" data-n="' + esc(f.filename) + '">delete</button>' : '') +
                '</figcaption></figure>';
            }).join('') + '</div>'
          : '';

        list.innerHTML = photoHtml + papers.map(function(f){
          var kb = f.size_bytes < 1048576 ? Math.round(f.size_bytes/1024) + ' KB'
                                          : (f.size_bytes/1048576).toFixed(1) + ' MB';
          return '<div class="pn-doc">' +
            '<span class="k">' + esc(f.kind) + '</span>' +
            '<span class="n">' + esc(f.filename) + '</span>' +
            '<span class="s">' + kb + '</span>' +
            '<a href="/api/panel/document?id=' + esc(f.id) + '&inline=1" target="_blank" rel="noopener">Open</a>' +
            '<a href="/api/panel/document?id=' + esc(f.id) + '">Download</a>' +
            (isOwner() ? '<button class="del" data-id="' + esc(f.id) + '" data-n="' + esc(f.filename) + '">Delete</button>' : '') +
            '</div>';
        }).join('');
        Array.prototype.forEach.call(list.querySelectorAll('button.del'), function(btn){
          btn.addEventListener('click', function(){
            if(!confirm('Delete ' + btn.dataset.n + ' permanently?')) return;
            fetch('/api/panel/document?id=' + encodeURIComponent(btn.dataset.id),
                  {method:'DELETE', credentials:'same-origin'}).then(function(){ loadDocs(ref); });
          });
        });
      })
      .catch(function(){ list.innerHTML = '<p class="pn-hint2">Could not load documents.</p>'; });

    var up = $('#pnDocUp');
    if(up) up.onclick = function(){
      var file = $('#pnDocFile').files[0];
      if(!file) return note('#pnDocMsg', 'Choose a file first.', false);
      if(file.size > 15 * 1024 * 1024) return note('#pnDocMsg', 'That file is over 15 MB.', false);
      up.disabled = true; up.textContent = 'Uploading\u2026';
      fetch('/api/panel/document?reference=' + encodeURIComponent(ref) +
            '&filename=' + encodeURIComponent(file.name) +
            '&kind=' + encodeURIComponent($('#pnDocKind').value), {
        method:'POST', credentials:'same-origin',
        headers:{'Content-Type': file.type || 'application/octet-stream'}, body: file
      }).then(function(r){
        return r.json().catch(function(){ return {}; }).then(function(b){ return {ok:r.ok,b:b}; });
      }).then(function(r){
        up.disabled = false; up.textContent = 'Upload';
        if(r.ok){ $('#pnDocFile').value = ''; note('#pnDocMsg', 'Uploaded.', true); loadDocs(ref); return; }
        note('#pnDocMsg', r.b.error === 'unsupported_type'
          ? 'That file type is not accepted. Use PDF, JPG, PNG, WEBP, HEIC or DOCX.'
          : r.b.error === 'too_large' ? 'That file is over 15 MB.'
          : 'Upload failed: ' + (r.b.error || 'unknown'), false);
      }).catch(function(){
        up.disabled = false; up.textContent = 'Upload';
        note('#pnDocMsg', 'Could not reach the server.', false);
      });
    };
  }

  /* -------------------------------------------------------------- new record */
  $('#pnNew').addEventListener('click', function(){
    $('#pnModalBox').innerHTML =
      '<h3 style="font-size:17px;margin-bottom:6px">New application</h3>' +
      '<p class="pn-hint2" style="margin-top:0">For somebody who paid by transfer, signed up over ' +
      'the phone, or predates this system. A reference is generated automatically.</p>' +
      '<div class="pn-grid">' +
      FIELDS.map(function(f){
        var input = f.type === 'select'
          ? '<select id="nw_' + f.k + '" class="pn-in">' + f.options.map(function(o){
              return '<option value="' + esc(o) + '">' + esc(o || '\u2014') + '</option>'; }).join('') + '</select>'
          : f.type === 'textarea' ? '<textarea id="nw_' + f.k + '" class="pn-in"></textarea>'
          : '<input id="nw_' + f.k + '" class="pn-in" type="' + (f.type || 'text') + '">';
        return '<div' + (f.wide ? ' class="wide"' : '') + '><label for="nw_' + f.k + '">' + esc(f.label) + '</label>' + input + '</div>';
      }).join('') +
      '<div><label for="nw_status">Status</label><select id="nw_status" class="pn-in">' +
      '<option value="pending">pending</option><option value="paid">paid</option></select></div>' +
      '</div><div class="pn-acts"><button class="pn-b" id="nwGo">Create</button>' +
      '<button class="pn-b gh" id="nwCancel">Cancel</button></div>' +
      '<div class="pn-msg2" id="nwMsg"></div>';
    $('#pnModal').classList.add('open');
    $('#nwCancel').onclick = function(){ $('#pnModal').classList.remove('open'); };
    $('#nwGo').onclick = function(){
      var body = {status: $('#nw_status').value};
      FIELDS.forEach(function(f){ var el = $('#nw_' + f.k); if(el && el.value.trim()) body[f.k] = el.value.trim(); });
      api('create', body, 'POST').then(function(res){
        $('#pnModal').classList.remove('open');
        load();
        setTimeout(function(){ openRow(res.reference); }, 600);
      }).catch(function(e){ note('#nwMsg', e.message, false); });
    };
  });
  $('#pnModal').addEventListener('click', function(e){
    if(e.target.id === 'pnModal') $('#pnModal').classList.remove('open');
  });

  $('#pnRecon').addEventListener('click', function(){
    var b = $('#pnRecon'), was = b.textContent;
    b.disabled = true; b.textContent = 'Asking Stripe\u2026';
    api('reconcile', {}, 'POST').then(function(r){
      var bits = ['checked ' + r.checked];
      if(r.settled.length) bits.push(r.settled.length + ' were actually paid: ' + r.settled.join(', '));
      if(r.stillUnpaid.length) bits.push(r.stillUnpaid.length + ' genuinely unpaid');
      if(r.errors.length) bits.push(r.errors.length + ' could not be checked');
      alert(r.settled.length
        ? 'Reconciled.\n\n' + bits.join('\n') + '\n\nThose are now marked paid.'
        : 'Reconciled. ' + bits.join(', ') + '.\n\nNothing needed changing.');
      load();
      if(selected) openRow(selected);
    }).catch(function(e){ alert('Could not reconcile:\n\n' + e.message); })
      .then(function(){ b.disabled = false; b.textContent = was; });
  });

  var t;
  ['#pnSort','#pnClosed','#pnDocs'].forEach(function(s){
    $(s).addEventListener('change', load);
  });
  ['#pnBMin','#pnBMax'].forEach(function(s){
    $(s).addEventListener('input', function(){ clearTimeout(t); t = setTimeout(load, 450); });
  });
  $('#pnNewListing').addEventListener('click', function(){ listingForm(null); });
  $('#pnImport').addEventListener('click', importDialog);
  $('#pnBulk').addEventListener('click', bulkDialog);

  /* Paste a post you already read, and the fields fill themselves in. The
     parsing happens server-side so there is one implementation, and every value
     lands in an editable field because a guess should always be correctable. */
  $('#pnPaste').addEventListener('click', function(){
    $('#pnModalBox').innerHTML =
      '<h3 style="font-size:17px;margin-bottom:6px">Paste a post</h3>' +
      '<p class="pn-hint2" style="margin-top:0">Copy a post you have read, paste it here, and the ' +
      'listing form fills itself in. Check what it guessed before saving.</p>' +
      '<textarea id="pp_text" class="pn-in" style="min-height:200px" ' +
      'placeholder="Paste the whole post, including the contact line and any photo links."></textarea>' +
      '<div class="pn-acts"><button class="pn-b" id="ppGo">Read it</button>' +
      '<button class="pn-b gh" id="ppCancel">Cancel</button></div>' +
      '<div class="pn-msg2" id="ppMsg"></div>';
    $('#pnModal').classList.add('open');
    $('#ppCancel').onclick = function(){ $('#pnModal').classList.remove('open'); };
    $('#ppGo').onclick = function(){
      api('parsePost', {text: $('#pp_text').value}, 'POST')
        .then(function(res){
          var d = res.parsed;
          if(d.kind === 'seeking'){
            note('#ppMsg', 'This reads like somebody looking for a room, not offering one. ' +
              'Add them as a client instead, from the Clients tab.', false);
            return;
          }
          $('#pnModal').classList.remove('open');
          /* Straight into the normal listing form, pre-filled. */
          listingForm(null);
          setTimeout(function(){
            var set = function(id, v){ var e = $('#ls_' + id); if(e && v) e.value = v; };
            set('address', d.address); set('rent', d.rent); set('size', d.size);
            set('available_from', d.available_from); set('registration', d.registration);
            set('contact_email', d.contact_email); set('contact_phone', d.contact_phone);
            set('external_url', d.external_url); set('description', d.description);
            set('images', (d.images || []).join('\n'));
            if(d.address && $('#ls_title') && !$('#ls_title').value){
              $('#ls_title').value = d.address.split(',')[0];
            }
            var box = $('#pnModalBox');
            if(box) box.insertAdjacentHTML('afterbegin',
              '<p class="pn-msg2 show" style="margin-bottom:12px">Filled in from the post. ' +
              'Check every field, especially the address and the rent.</p>');
          }, 260);
        })
        .catch(function(e){ note('#ppMsg', e.message, false); });
    };
  });

  $('#pnClear').addEventListener('click', function(){
    $('#pnQ').value = ''; $('#pnStatus').value = 'all'; $('#pnSort').value = 'recent';
    $('#pnClosed').value = 'all'; $('#pnDocs').value = 'all';
    $('#pnBMin').value = ''; $('#pnBMax').value = '';
    load();
  });

  /* Switching between the views. They share the list but answer different
     questions, so the toolbar changes with them. */
  Array.prototype.forEach.call(document.querySelectorAll('.pn-tab'), function(tab){
    tab.addEventListener('click', function(){
      view = tab.dataset.view;
      Array.prototype.forEach.call(document.querySelectorAll('.pn-tab'), function(x){
        x.classList.toggle('on', x === tab);
      });
      var clients = view === 'clients';
      var archived = view === 'archived';
      $('#pnKind').style.display = clients ? '' : 'none';
      $('#pnMailKind').style.display = view === 'mail' ? '' : 'none';
      $('#pnStatus').style.display = (clients || archived) ? '' : 'none';
      $('#pnFilters').style.display = (clients || archived) ? '' : 'none';
      if($('#pnRecon')) $('#pnRecon').style.display = (clients && isOwner()) ? '' : 'none';
      if($('#pnNew')) $('#pnNew').style.display = (clients && isOwner()) ? '' : 'none';
      if($('#pnNewListing')) $('#pnNewListing').style.display = (view === 'listings' && isOwner()) ? '' : 'none';
      if($('#pnImport')) $('#pnImport').style.display = (view === 'listings' && isOwner()) ? '' : 'none';
      if($('#pnBulk')) $('#pnBulk').style.display =
        (view === 'mail' && $('#pnMailKind').value === 'clients' && isOwner()) ? '' : 'none';
      if($('#pnPaste')) $('#pnPaste').style.display = (view === 'listings' && isOwner()) ? '' : 'none';
      selected = null;
      $('#pnPane').innerHTML = '<div class="pn-empty"><div>' +
        (view === 'mail' ? 'Select somebody to see what has been sent to them.'
         : archived ? 'Select an archived client to see everything we hold,<br>or to restore them.'
         : 'Select an entry.') + '</div></div>';
      load();
    });
  });

  $('#pnQ').addEventListener('input', function(){ clearTimeout(t); t = setTimeout(load, 350); });
  $('#pnStatus').addEventListener('change', load);
  $('#pnRefresh').addEventListener('click', load);
  $('#pnKind').addEventListener('change', function(){
    selected = null;
    $('#pnPane').innerHTML = '<div class="pn-empty"><div>Select an entry.</div></div>';
    load();
  });
  $('#pnMailKind').addEventListener('change', function(){
    selected = null;
    if($('#pnBulk')) $('#pnBulk').style.display =
      (this.value === 'clients' && isOwner()) ? '' : 'none';
    $('#pnPane').innerHTML = '<div class="pn-empty"><div>' +
      (this.value === 'sent' ? 'Select an email to read what was sent.'
       : 'Select somebody to see what has been sent to them.') + '</div></div>';
    load();
  });

  fetch('/api/admin/me', {credentials:'same-origin'})
    .then(function(r){ return r.json(); })
    .then(function(d){ d.authenticated ? showPanel(d.user) : showLogin(); })
    .catch(showLogin);
})();
</script>
</main>
